<title>PibraCompta – SCI PIBRAMEDIC</title>
<style>
:root{
  --bleu:#d6e8fa;--bleu-f:#3d7cc9;--vert:#d7f0e1;--vert-f:#2f9a5f;--orange:#fde4cc;--orange-f:#d07a2b;--violet:#e6dcf7;--violet-f:#7a5bc0;
  --rose:#f9dbe6;--rose-f:#c4507b;--jaune:#fbf1c7;--jaune-f:#b08a12;--teal:#d2f0ef;--teal-f:#2a9893;--gris:#eef1f5;--gris-f:#5d6b7e;
  --rouge:#fbe0de;--rouge-f:#c9443b;--texte:#1f2a37;--doux:#6b7686;--bord:#e3e7ee;--fond:#ffffff;--fond2:#f7f9fb;--accent:#3d7cc9;
  --r:10px;--ombre:0 1px 3px rgba(20,30,50,.07),0 4px 14px rgba(20,30,50,.05)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;height:100vh;height:100dvh}
.nav{width:228px;flex:none;border-right:1px solid var(--bord);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;background:var(--fond)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo svg{flex:none;border-radius:8px}.logo b{font-size:16px;letter-spacing:.2px}.logo small{display:block;color:var(--doux);font-size:11px;line-height:1.2}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--texte);cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--fond2)}
.nav a.actif{background:var(--fond2);font-weight:600}
.pastille{width:10px;height:10px;border-radius:3px;flex:none}
.nav .bas{margin-top:auto;padding:10px;color:var(--doux);font-size:12px;border-top:1px solid var(--bord)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.entete{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--bord);min-height:56px}
.entete h1{font-size:18px;margin:0;font-weight:650;display:flex;align-items:center;gap:10px}
.entete .esp{flex:1}
.contenu{flex:1;overflow-y:auto;padding:18px 22px 90px}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.carte{background:var(--fond);border:1px solid var(--bord);border-radius:var(--r);padding:14px 16px;box-shadow:var(--ombre);position:relative}
.carte h3{margin:0 0 8px;font-size:13px;color:var(--doux);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.carte .gros{font-size:24px;font-weight:650;letter-spacing:-.3px}
.carte .sous{color:var(--doux);font-size:12.5px}
.carte.marque{border-left:4px solid var(--c,var(--bord))}
.bloc{margin:18px 0}
.bloc>h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.barre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--bord);background:var(--fond);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--texte)}
.btn:hover{background:var(--fond2)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{filter:brightness(1.07)}
.btn.danger{color:var(--rouge-f);border-color:#f1c4c0}
.btn.petit{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--bord);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.onglets a{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--doux);white-space:nowrap;text-decoration:none}
.onglets a.actif{color:var(--texte);border-color:var(--c,var(--accent));font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{border:1px solid var(--bord);border-radius:8px;padding:7px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd6f5;border-color:#9cc2ee}
textarea{min-height:70px;resize:vertical}
label.champ{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--doux)}
label.champ>span{font-weight:550}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.form .large{grid-column:1/-1}
.case{display:flex;align-items:center;gap:8px;cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--fond2);text-align:left;font-weight:600;color:var(--doux);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--bord);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--bord);vertical-align:top}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:#fafcff}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:650;background:var(--fond2)}
table.t tr.sep td{background:var(--fond2);font-weight:600;color:var(--doux)}
.tab-wrap{overflow:auto;border:1px solid var(--bord);border-radius:var(--r);max-height:70vh}
.puce{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-vert{background:var(--vert);color:#1f6b42}.p-orange{background:var(--orange);color:#8a4c12}.p-rouge{background:var(--rouge);color:#9b2c25}
.p-gris{background:var(--gris);color:var(--gris-f)}.p-bleu{background:var(--bleu);color:#245a99}.p-violet{background:var(--violet);color:#583f99}.p-jaune{background:var(--jaune);color:#7d6107}
.pos{color:var(--vert-f)}.neg{color:var(--rouge-f)}.doux{color:var(--doux)}.gras{font-weight:650}
.alerte{display:block;padding:10px 12px;border-radius:8px;background:var(--jaune);margin-bottom:8px;font-size:13px}
.alerte.rouge{background:var(--rouge)}.alerte.bleu{background:var(--bleu)}.alerte.vert{background:var(--vert)}
.modal-fond{position:fixed;inset:0;background:rgba(20,30,45,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.large{max-width:1100px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bord)}
.modal header h2{margin:0;font-size:16px;flex:1}
.modal .corps{padding:16px 18px;overflow-y:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--bord);flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--doux);line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:#9b2c25}
.charge{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);z-index:90;flex-direction:column;gap:12px;color:var(--texte);font-size:15px;-webkit-font-smoothing:antialiased}
.rond{width:34px;height:34px;border:3px solid var(--bleu);border-top-color:var(--accent);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.grille-loyers td.m{text-align:center;padding:4px 3px;min-width:52px}
.grille-loyers .cel{display:block;border-radius:6px;padding:4px 2px;font-size:11.5px;cursor:pointer;font-weight:600}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--doux);margin:8px 0}
.connexion{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#f3f8fe,#fbf7fd)}
.connexion .carte{width:100%;max-width:400px;padding:26px}
.connexion h1{font-size:20px;margin:6px 0 2px}
.depot{border:2px dashed #c9d6e6;border-radius:12px;padding:22px;text-align:center;color:var(--doux);cursor:pointer;background:var(--fond2)}
.depot.survol{border-color:var(--accent);background:var(--bleu)}
.liste-mob{display:none}
.ligne-mob{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bord);align-items:center;cursor:pointer}
.ligne-mob .l1{flex:1;min-width:0}
.ligne-mob .l1 div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apercu{width:100%;height:70vh;border:1px solid var(--bord);border-radius:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--doux)}.kv dd{margin:0}
.barres{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
.barres .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--doux);gap:3px;min-width:0}
.barres .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--jaune-f);opacity:.75}
.barres .b i.neg{background:var(--rouge-f)}
.mobile-nav{display:none}
.fab{display:none}
.vide{padding:28px;text-align:center;color:var(--doux)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:20px;border:1px solid var(--bord);cursor:pointer;font-size:12.5px;background:#fff}
.chip.actif{background:var(--texte);color:#fff;border-color:var(--texte)}
.sugg{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bord);border-radius:8px;margin-bottom:6px;cursor:pointer}
.sugg:hover{background:var(--vert)}
details.aide{background:var(--fond2);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
details.aide summary{cursor:pointer;font-weight:600}
/* agenda */
.dispo-page{align-items:flex-start}
.dispo-page p{margin:6px 0}
.dp-etape{border:1px solid var(--bord);border-radius:var(--r);padding:12px;margin:12px 0}
.dp-off{opacity:.4;pointer-events:none}
.ag-dj2{padding:10px 2px;border-bottom:1px solid var(--bord)}
.ag-dj2-t{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.ag-dj2 .jour{width:96px;flex:none;font-weight:600;font-size:13px}
.ag-dj2.we .jour{color:var(--doux);font-weight:500}
.ag-slots{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px 106px}
.ag-slot{position:relative;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;background:var(--vert);border-radius:10px;padding:6px 38px 6px 10px}
.ag-slot.nouveau{outline:1.5px dashed var(--vert-f)}
.ag-slot.faux{background:var(--rouge);outline:1.5px solid var(--rouge-f)}
.ag-h{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.ag-slot input[type=time]{width:auto;min-width:92px;padding:5px 6px;font-size:14px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--bord2,#d5dbe5);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--texte);font-family:inherit;white-space:nowrap}
.seg button+button{border-left:1px solid var(--bord2,#d5dbe5)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on[data-m=distanciel]{background:var(--violet-f)}
.seg button.on[data-m=les_deux]{background:var(--teal-f)}
.ag-x{position:absolute;top:50%;right:4px;transform:translateY(-50%);border:none;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--doux);padding:2px 8px}
.t-bleu{--tc:var(--bleu);--tf:var(--bleu-f)}.t-violet{--tc:var(--violet);--tf:var(--violet-f)}.t-orange{--tc:var(--orange);--tf:var(--orange-f)}.t-teal{--tc:var(--teal);--tf:var(--teal-f)}.t-rose{--tc:var(--rose);--tf:var(--rose-f)}.t-gris{--tc:var(--gris);--tf:var(--gris-f)}
.ag-pu{background:var(--tc);color:var(--tf)}
.ag-grille{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--bord);border:1px solid var(--bord);border-radius:var(--r);overflow:hidden}
.ag-tete{background:var(--fond2);padding:6px 4px;font-size:12px;color:var(--doux);font-weight:600;text-align:center}
.ag-j{background:var(--fond);min-height:98px;padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.ag-j:hover{background:#fafcff}
.ag-j.hors{background:#fbfcfd}.ag-j.hors .ag-n{color:#b4bcc8}
.ag-j.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ag-n{font-size:12px;font-weight:600;color:var(--doux);align-self:flex-start;padding:0 5px;border-radius:10px;line-height:19px}
.ag-j.auj .ag-n{background:var(--accent);color:#fff}
.ag-ev{font-size:11.5px;line-height:1.35;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--tc);border-left:3px solid var(--tf)}
.ag-ev.fait,.ag-barre{text-decoration:line-through;opacity:.6}
.ag-plus{font-size:11px;color:var(--doux);padding-left:4px}
.ag-pts{display:none}
.ag-pt{width:7px;height:7px;border-radius:4px;background:var(--tf);flex:none}
.ag-filtre:not(.actif-t){opacity:.45;text-decoration:line-through}
.ag-liste .item{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bord);align-items:flex-start;cursor:pointer}
.ag-liste .item:hover{background:#fafcff}
.ag-heure{width:70px;flex:none;font-variant-numeric:tabular-nums;color:var(--doux);font-size:12.5px;line-height:1.35}
.ag-barre-c{width:4px;align-self:stretch;border-radius:2px;background:var(--tf);flex:none}
.ag-coche{width:18px;height:18px;margin-top:2px;flex:none;cursor:pointer}
.ag-texte{white-space:pre-wrap;background:var(--fond2);border-radius:8px;padding:8px 10px;margin-top:3px;font-size:13px}
.ag-bloc{margin-top:14px}.ag-lib{display:block;font-size:12.5px;color:var(--doux);font-weight:550}
.ag-pers .chip{user-select:none}
.chip.p-sans{border-style:dashed}
.ag-dj{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:8px 2px;border-bottom:1px solid var(--bord)}
.ag-dj .jour{width:96px;flex:none;font-weight:600;font-size:13px}
.ag-dj.we .jour{color:var(--doux);font-weight:500}
.ag-crs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:120px}
.ag-presets{display:flex;gap:4px;flex-wrap:wrap}
.ag-cr{display:inline-flex;align-items:center;gap:4px;padding:2px 2px 2px 9px;border-radius:14px;background:var(--vert);color:#1e6b40;font-size:12px;white-space:nowrap}
.ag-cr.nouveau{outline:1.5px dashed var(--vert-f)}
.ag-cr button{border:none;background:transparent;cursor:pointer;color:inherit;font-size:15px;line-height:1;padding:0 6px}
.ag-enreg{position:sticky;bottom:0;background:var(--fond);padding:10px 0;border-top:1px solid var(--bord);display:flex;gap:8px;z-index:3}
.ag-mat td,.ag-mat th{text-align:center}.ag-mat td:first-child,.ag-mat th:first-child{text-align:left}
@media (max-width:900px){
  .ag-j{min-height:50px;padding:3px}
  .ag-ev,.ag-plus{display:none}
  .ag-pts{display:flex;gap:3px;flex-wrap:wrap;padding-left:3px}
  .ag-enreg{bottom:calc(58px + env(safe-area-inset-bottom))}
  .ag-dj .jour{width:100%}
  .ag-dj2 .jour{width:100%}
  .ag-slots{margin-left:0}
  .ag-slot{padding-right:8px}
  .ag-h{flex:1;margin-right:30px;min-width:0}
  .ag-slot .ag-x{top:8px;transform:none}
  .seg .ic{display:none}
  .ag-slot .seg{width:100%}
  .seg button{flex:1;padding:8px 4px;font-size:12.5px}
  .ag-slot input[type=time]{min-width:0;flex:1}
}
@media (max-width:900px){
  .nav{display:none}
  .entete{padding:10px 14px;min-height:50px;position:sticky;top:0;background:#fff;z-index:5}
  .entete h1{font-size:16px}
  .contenu{padding:12px 12px 96px}
  .grille{grid-template-columns:1fr 1fr;gap:10px}
  .carte{padding:12px}
  .carte .gros{font-size:19px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bord);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobile-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--doux);text-decoration:none;cursor:pointer;padding:3px 0}
  .mobile-nav a.actif{color:var(--texte);font-weight:650}
  .mobile-nav .pastille{width:18px;height:6px;border-radius:4px}

<body>
<div class="charge"><div class="rond"></div><div class="txt">Chargement de PibraCompta…</div></div>
<script>
/* ===== compta.js ===== */
/* =====================================================================
   PibraCompta — moteur comptable (partagé : navigateur + tests Node)
   SCI à l'IR, sans TVA. Montants en euros, calculs en centimes.
   ===================================================================== */
var Compta = (function () {
  'use strict';

  // ---------- utilitaires ----------
  function num(x) {
    if (typeof x === 'number') return isFinite(x) ? x : 0;
    if (x === null || x === undefined || x === '') return 0;
    var s = String(x).replace(/[\s  €]/g, '');
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
      // 1.234,56 ou 1,234.56
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else s = s.replace(',', '.');
    var n = Number(s);
    return isFinite(n) ? n : 0;
  }
  function c(x) { return Math.round(num(x) * 100); }          // en centimes
  function r2(x) { return Math.round(num(x) * 100) / 100; }
  function eur(x, opt) {
    var v = r2(x);
    var s = v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (opt && opt.signe && v > 0 ? '+' : '') + s + ' €';
  }
  function annee(d) { return String(d || '').slice(0, 4); }
  function vivant(r) { return r && String(r.supprime || '') !== '1' && r.supprime !== true; }
  function L(DB, t) { return (DB[t] || []).filter(vivant); }
  function byId(DB, t, id) { return L(DB, t).find(function (r) { return String(r.id) === String(id); }); }
  function finMois(p) { var y = +p.slice(0, 4), m = +p.slice(5, 7); var d = new Date(Date.UTC(y, m, 0)); return p + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  function addMonths(dateStr, n) {
    var y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7) - 1, d = +dateStr.slice(8, 10);
    var t = new Date(Date.UTC(y, m + n, 1));
    var last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    t.setUTCDate(Math.min(d, last));
    return t.toISOString().slice(0, 10);
  }
  function jours(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
  function parseJSON(s, def) { if (!s) return def; if (typeof s !== 'string') return s; try { return JSON.parse(s); } catch (e) { return def; } }

  // ---------- comptes système ----------
  var SYS = {
    BANQUE: '512000', CLIENTS: '411000', FOURN: '401000', ATTENTE: '471000', VIR: '580000',
    RESULTAT: '120000', CAPITAL: '101300', RESERVE: '106100', REPORT: '110000',
    LOYERS: '706000', REFACT_CH: '708300', REFACT_TF: '708400', AUTRES_PROD: '708800',
    INTERETS: '661100', ASSUR_EMP: '616100', DEPOT: '165000'
  };
  var LIB_FIXES = {
    '211000': 'Terrains', '213000': 'Constructions', '101300': 'Capital social', '106100': 'Réserve légale',
    '110000': 'Report à nouveau', '120000': "Résultat de l'exercice", '129000': "Résultat de l'exercice (perte)",
    '165000': 'Dépôts de garantie reçus', '401000': 'Fournisseurs', '401700': 'Fournisseurs – retenues de garantie',
    '411000': 'Clients (locataires)', '471000': "Compte d'attente", '580000': 'Virements internes',
    '512000': 'Banque', '706000': 'Loyers', '708300': 'Charges locatives refacturées', '708400': 'Taxe foncière refacturée',
    '708800': 'Autres produits refacturés', '661100': "Intérêts d'emprunts", '616100': 'Assurance emprunteur'
  };

  function comptesLibelles(DB) {
    var m = Object.assign({}, LIB_FIXES);
    L(DB, 'categories').forEach(function (k) { if (k.compte) m[String(k.compte)] = k.libelle; });
    L(DB, 'associes').forEach(function (a) { if (a.compte_courant) m[String(a.compte_courant)] = 'Compte courant ' + nomAssocie(a); });
    L(DB, 'emprunts').forEach(function (e) { if (e.compte) m[String(e.compte)] = 'Emprunt ' + e.libelle; });
    L(DB, 'comptes').forEach(function (b) { if (b.compte_comptable) m[String(b.compte_comptable)] = b.nom; });
    return m;
  }
  function nomAssocie(a) { return a ? ((a.prenom ? a.prenom + ' ' : '') + (a.nom || '')).trim() : ''; }

  // ---------- parts sociales ----------
  function partsA(DB, associeId, date) {
    var rows = L(DB, 'parts').filter(function (p) { return String(p.associe_id) === String(associeId) && String(p.date_effet) <= date; })
      .sort(function (x, y) { return String(x.date_effet).localeCompare(String(y.date_effet)); });
    return rows.length ? num(rows[rows.length - 1].nb_parts) : 0;
  }
  function associesOrdonnes(DB) {
    return L(DB, 'associes').slice().sort(function (a, b) { return num(a.ordre) - num(b.ordre) || String(a.nom).localeCompare(String(b.nom)); });
  }
  // Répartition des parts pour une année : à la clôture (défaut) ou prorata temporis
  function poidsAnnee(DB, an) {
    var mode = (DB.params && DB.params.repartition_mode) || 'cloture';
    var fin = an + '-12-31', deb = an + '-01-01';
    return associesOrdonnes(DB).map(function (a) {
      var w;
      if (mode === 'prorata') {
        // somme des parts jour par jour
        var dates = L(DB, 'parts').filter(function (p) { return String(p.associe_id) === String(a.id); })
          .map(function (p) { return String(p.date_effet); }).filter(function (d) { return d > deb && d <= fin; }).sort();
        var points = [deb].concat(dates), tot = 0;
        for (var i = 0; i < points.length; i++) {
          var d0 = points[i], d1 = i + 1 < points.length ? points[i + 1] : addMonths(fin, 0);
          var nbj = i + 1 < points.length ? jours(d0, d1) : jours(d0, fin) + 1;
          tot += partsA(DB, a.id, d0) * nbj;
        }
        w = tot / (jours(deb, fin) + 1);
      } else w = partsA(DB, a.id, fin);
      return { id: a.id, associe: a, parts: w };
    }).filter(function (x) { return x.parts > 0; });
  }
  // Arrondi de chaque quote-part, écart d'arrondi porté sur le dernier associé (méthode du cabinet comptable)
  function repartir(total, poids, sansAjustement) {
    var T = c(total), W = poids.reduce(function (s, p) { return s + p.parts; }, 0);
    if (!W) return poids.map(function () { return 0; });
    var res = poids.map(function (p) { return Math.round(T * p.parts / W); });
    var ecart = T - res.reduce(function (s, x) { return s + x; }, 0);
    if (res.length && !sansAjustement) res[res.length - 1] += ecart;
    return res.map(function (x) { return x / 100; });
  }

  // ---------- catégories ----------
  function categorie(DB, id) {
    if (!id) return null;
    var k = byId(DB, 'categories', id);
    if (k) return k;
    var s = String(id);
    if (s.indexOf('CCA:') === 0) {
      var a = byId(DB, 'associes', s.slice(4));
      if (a) return { id: s, libelle: 'Compte courant ' + nomAssocie(a), compte: a.compte_courant, type: 'bilan', groupe: 'Associés' };
    }
    if (s.indexOf('EMP:') === 0) {
      var e = byId(DB, 'emprunts', s.slice(4));
      if (e) return { id: s, libelle: 'Échéance ' + e.libelle, compte: e.compte, type: 'emprunt', groupe: 'Emprunts', emprunt: e };
    }
    if (s.indexOf('BAIL:') === 0) {
      var b = byId(DB, 'baux', s.slice(5));
      if (b) return { id: s, libelle: 'Règlement ' + b.locataire, compte: SYS.CLIENTS, aux: b.code_client, type: 'bail', groupe: 'Loyers' };
    }
    return null;
  }
  function toutesCategories(DB) {
    var out = L(DB, 'categories').filter(function (k) { return String(k.actif) !== '0'; }).slice();
    associesOrdonnes(DB).forEach(function (a) { out.push(categorie(DB, 'CCA:' + a.id)); });
    L(DB, 'emprunts').forEach(function (e) { out.push(categorie(DB, 'EMP:' + e.id)); });
    L(DB, 'baux').filter(function (b) { return String(b.actif) !== '0'; }).forEach(function (b) { out.push(categorie(DB, 'BAIL:' + b.id)); });
    return out.filter(Boolean);
  }

  // ---------- emprunts ----------
  function echeancierEmprunt(DB, emp) {
    var rows = L(DB, 'emprunt_echeances').filter(function (x) { return String(x.emprunt_id) === String(emp.id); })
      .map(function (x) { return { id: x.id, date: x.date, capital: num(x.capital), interets: num(x.interets), assurance: num(x.assurance), crd: num(x.crd), importe: true }; })
      .sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (rows.length) return rows;
    // génération à partir des paramètres (prêt amortissable à échéances constantes)
    var C = num(emp.crd_depart) || num(emp.capital), t = num(emp.taux) / 100 / 12, n = num(emp.duree_mois) || 600, d0 = emp.date_premiere_echeance;
    if (!C || !d0 || (!num(emp.duree_mois) && !num(emp.echeance_mensuelle))) return [];
    var ass = num(emp.assurance_mensuelle);
    var A = num(emp.echeance_mensuelle) ? num(emp.echeance_mensuelle) - ass : (t ? C * t / (1 - Math.pow(1 + t, -n)) : C / n);
    var crd = C, out = [];
    for (var i = 0; i < n && crd > 0.004; i++) {
      var it = r2(crd * t), cap = r2(i === n - 1 || A - it >= crd ? crd : A - it);
      crd = r2(crd - cap);
      out.push({ id: emp.id + '#' + (i + 1), date: addMonths(d0, i), capital: cap, interets: it, assurance: ass, crd: crd, importe: false });
    }
    return out;
  }
  function trouverEcheanceEmprunt(DB, emp, date, montant) {
    var ech = echeancierEmprunt(DB, emp), best = null, bestScore = 1e9;
    ech.forEach(function (e) {
      var tot = e.capital + e.interets + e.assurance;
      var s = Math.abs(jours(e.date, date)) + (Math.abs(c(tot) - c(Math.abs(montant))) > 1 ? 1000 : 0);
      if (s < bestScore) { bestScore = s; best = e; }
    });
    return bestScore < 1000 && Math.abs(jours(best.date, date)) <= 20 ? best : null;
  }

  // ---------- échéances de loyers ----------
  var LIGNES_ECH = [
    { k: 'loyer', compte: SYS.LOYERS, lib: 'Loyer' },
    { k: 'prov_charges', compte: SYS.REFACT_CH, lib: 'Provision sur charges' },
    { k: 'tf', compte: SYS.REFACT_TF, lib: 'Taxe foncière' },
    { k: 'om', compte: SYS.REFACT_CH, lib: 'Ordures ménagères' },
    { k: 'regul', compte: SYS.REFACT_CH, lib: 'Régularisation de charges' },
    { k: 'appel', compte: SYS.REFACT_CH, lib: 'Appel de fonds (charges)' },
    { k: 'autre', compte: SYS.AUTRES_PROD, lib: 'Autre' }
  ];
  function totalEcheance(e) { return r2(LIGNES_ECH.reduce(function (s, l) { return s + num(e[l.k]); }, 0)); }
  function dateEcheance(e) { return e.date || (e.periode ? e.periode + '-01' : ''); }
  function lettragesVers(DB, type, id) {
    return L(DB, 'lettrages').filter(function (l) { return l.cible_type === type && String(l.cible_id) === String(id); });
  }
  function statutEcheance(DB, e, aujourdhui) {
    var du = totalEcheance(e);
    var paye = r2(lettragesVers(DB, 'echeance', e.id).reduce(function (s, l) { return s + num(l.montant); }, 0));
    var reste = r2(du - paye), st;
    if (Math.abs(c(reste)) <= 0) st = 'payé';
    else if (du > 0 && reste < 0) st = 'payé';
    else if (du < 0 && paye <= du) st = 'payé';
    else if (paye !== 0) st = 'partiel';
    else st = (dateEcheance(e) <= (aujourdhui || '9999')) ? 'attendu' : 'à venir';
    if ((st === 'attendu' || st === 'partiel') && aujourdhui && jours(dateEcheance(e), aujourdhui) > 15) st = 'impayé';
    return { du: du, paye: paye, reste: reste, statut: st };
  }
  function statutFacture(DB, f) {
    var du = num(f.montant_ttc);
    var paye = r2(-lettragesVers(DB, 'facture', f.id).reduce(function (s, l) { return s + num(l.montant); }, 0));
    var reste = r2(du - paye);
    return { du: du, paye: paye, reste: reste, statut: Math.abs(c(reste)) <= 0 ? 'payée' : (paye ? 'partielle' : 'à payer') };
  }

  // ---------- génération des écritures ----------
  function ecritures(DB, debut, fin) {
    var out = [], seq = {};
    var libs = comptesLibelles(DB);
    function inRange(d) { return (!debut || d >= debut) && (!fin || d <= fin); }
    function ecr(journal, date, piece, libelle, src, lignes) {
      seq[journal] = (seq[journal] || 0) + 1;
      var num_ = journal + String(seq[journal]).padStart(5, '0');
      lignes.forEach(function (l) {
        var d = c(l.debit), cr = c(l.credit);
        if (!d && !cr) return;
        if (d && cr) { var n = d - cr; d = n > 0 ? n : 0; cr = n < 0 ? -n : 0; }
        if (d < 0) { cr = -d; d = 0; }
        if (cr < 0) { d = -cr; cr = 0; }
        out.push({
          journal: journal, num: num_, date: date, piece: piece || '', compte: String(l.compte), aux: l.aux || '',
          auxLib: l.auxLib || '', compteLib: libs[String(l.compte)] || l.compteLib || '', libelle: l.libelle || libelle,
          debit: d / 100, credit: cr / 100, src: src
        });
      });
    }
    var signe = function (a) { return { debit: a < 0 ? -a : 0, credit: a > 0 ? a : 0 }; };

    // OD et à-nouveaux
    L(DB, 'od').forEach(function (o) {
      if (!inRange(o.date)) return;
      ecr(o.journal || 'OD', o.date, o.piece, o.libelle, { type: 'od', id: o.id }, parseJSON(o.lignes, []));
    });

    // Ventes : appels de loyers / charges
    var baux = {}; L(DB, 'baux').forEach(function (b) { baux[b.id] = b; });
    L(DB, 'echeances').forEach(function (e) {
      var d = dateEcheance(e); if (!inRange(d)) return;
      var b = baux[e.bail_id] || {}; var tot = totalEcheance(e); if (!c(tot)) return;
      var lib = (e.libelle || ('Appel ' + (e.type || 'loyer') + ' ' + (e.periode || d.slice(0, 7)))) + ' – ' + (b.locataire || '');
      var lignes = [{ compte: SYS.CLIENTS, aux: b.code_client, auxLib: b.locataire, debit: tot > 0 ? tot : 0, credit: tot < 0 ? -tot : 0 }];
      LIGNES_ECH.forEach(function (l) {
        var v = num(e[l.k]); if (!c(v)) return;
        lignes.push({ compte: l.k === 'autre' && e.compte_autre ? e.compte_autre : l.compte, libelle: l.lib + ' – ' + (b.locataire || ''), debit: v < 0 ? -v : 0, credit: v > 0 ? v : 0 });
      });
      ecr('VT', d, e.numero || e.periode, lib, { type: 'echeance', id: e.id }, lignes);
    });

    // Achats : factures fournisseurs
    var fourn = {}; L(DB, 'fournisseurs').forEach(function (f) { fourn[f.id] = f; });
    L(DB, 'factures').forEach(function (f) {
      if (!inRange(f.date)) return;
      var fo = fourn[f.fournisseur_id] || {}; var m = num(f.montant_ttc); if (!c(m)) return;
      var k = categorie(DB, f.categorie);
      var compteCh = k && k.compte ? k.compte : SYS.ATTENTE;
      var lib = (fo.nom || 'Fournisseur') + ' – ' + (f.libelle || f.numero || '');
      var vent = parseJSON(f.ventilation, null);
      var lignes = [{ compte: SYS.FOURN, aux: fo.code || '', auxLib: fo.nom || '', debit: m < 0 ? -m : 0, credit: m > 0 ? m : 0 }];
      if (vent && vent.length) {
        vent.forEach(function (v) { var kk = categorie(DB, v.categorie); var a = num(v.montant); lignes.push({ compte: kk && kk.compte || SYS.ATTENTE, libelle: v.libelle || lib, debit: a > 0 ? a : 0, credit: a < 0 ? -a : 0 }); });
      } else lignes.push({ compte: compteCh, libelle: lib, debit: m > 0 ? m : 0, credit: m < 0 ? -m : 0 });
      ecr('AC', f.date, f.numero, lib, { type: 'facture', id: f.id }, lignes);
    });

    // Banque
    var comptesB = {}; L(DB, 'comptes').forEach(function (b) { comptesB[b.id] = b; });
    var emprunts = {}; L(DB, 'emprunts').forEach(function (e) { emprunts[e.id] = e; });
    var echeances = {}; L(DB, 'echeances').forEach(function (e) { echeances[e.id] = e; });
    var factures = {}; L(DB, 'factures').forEach(function (f) { factures[f.id] = f; });
    var lettrParTx = {};
    L(DB, 'lettrages').forEach(function (l) { (lettrParTx[l.transaction_id] = lettrParTx[l.transaction_id] || []).push(l); });

    L(DB, 'transactions').forEach(function (t) {
      if (!inRange(t.date)) return;
      var m = num(t.montant); if (!c(m)) return;
      var bq = comptesB[t.compte_id] || {}; var cbq = bq.compte_comptable || SYS.BANQUE;
      var lignes = [{ compte: cbq, libelle: t.libelle, debit: m > 0 ? m : 0, credit: m < 0 ? -m : 0 }];
      var reste = m;
      (lettrParTx[t.id] || []).forEach(function (l) {
        var a = num(l.montant); reste = r2(reste - a);
        if (l.cible_type === 'echeance') {
          var e = echeances[l.cible_id] || {}; var b = baux[e.bail_id] || {};
          lignes.push(Object.assign({ compte: SYS.CLIENTS, aux: b.code_client, auxLib: b.locataire, libelle: 'Règlement ' + (b.locataire || '') + ' ' + (e.periode || '') }, signe(a)));
        } else if (l.cible_type === 'solde_initial') {
          var code = String(l.cible_id).split('|')[1] || '';
          var bx = L(DB, 'baux').find(function (x) { return x.code_client === code; }) || {};
          lignes.push(Object.assign({ compte: SYS.CLIENTS, aux: code, auxLib: bx.locataire || code, libelle: 'Règlement solde antérieur ' + (bx.locataire || code) }, signe(a)));
        } else if (l.cible_type === 'facture') {
          var f = factures[l.cible_id] || {}; var fo = fourn[f.fournisseur_id] || {};
          lignes.push(Object.assign({ compte: SYS.FOURN, aux: fo.code, auxLib: fo.nom, libelle: 'Règlement ' + (fo.nom || '') + ' ' + (f.numero || '') }, signe(a)));
        } else if (l.cible_type === 'emprunt') {
          var emp = emprunts[l.cible_ref] || {};
          var ee = echeancierEmprunt(DB, emp).find(function (x) { return String(x.id) === String(l.cible_id); });
          if (ee) {
            var tot = ee.capital + ee.interets + ee.assurance; var k = tot ? Math.abs(a) / tot : 0;
            var capi = r2(ee.capital * k), inte = r2(ee.interets * k), assu = r2(Math.abs(a) - capi - inte);
            var sg = a < 0 ? -1 : 1;
            lignes.push(Object.assign({ compte: emp.compte || '164000', libelle: 'Capital ' + (emp.libelle || '') }, signe(sg * capi)));
            if (c(inte)) lignes.push(Object.assign({ compte: SYS.INTERETS, libelle: 'Intérêts ' + (emp.libelle || '') }, signe(sg * inte)));
            if (c(assu)) lignes.push(Object.assign({ compte: SYS.ASSUR_EMP, libelle: 'Assurance ' + (emp.libelle || '') }, signe(sg * assu)));
          } else lignes.push(Object.assign({ compte: SYS.ATTENTE }, signe(a)));
        }
      });
      if (c(reste)) {
        var vent = parseJSON(t.ventilation, null);
        var parts = vent && vent.length ? vent.map(function (v) { return { categorie: v.categorie, montant: num(v.montant), libelle: v.libelle }; }) : [{ categorie: t.categorie, montant: reste }];
        parts.forEach(function (p) {
          var k = categorie(DB, p.categorie);
          if (k && k.type === 'emprunt') {
            var ee = trouverEcheanceEmprunt(DB, k.emprunt, t.date, p.montant);
            if (ee) {
              var tot = ee.capital + ee.interets + ee.assurance, kk = Math.abs(p.montant) / tot, sg = p.montant < 0 ? -1 : 1;
              var capi = r2(ee.capital * kk), inte = r2(ee.interets * kk), assu = r2(Math.abs(p.montant) - capi - inte);
              lignes.push(Object.assign({ compte: k.compte || '164000', libelle: 'Capital ' + k.emprunt.libelle }, signe(sg * capi)));
              if (c(inte)) lignes.push(Object.assign({ compte: SYS.INTERETS, libelle: 'Intérêts ' + k.emprunt.libelle }, signe(sg * inte)));
              if (c(assu)) lignes.push(Object.assign({ compte: SYS.ASSUR_EMP, libelle: 'Assurance ' + k.emprunt.libelle }, signe(sg * assu)));

var AIDE_COMPTE_COURANT = '<details class="aide" open style="font-size:13.5px;line-height:1.55"><summary style="font-size:14px">Comprendre le compte courant d’associé</summary>' +
  '<p><b>Ce que c’est.</b> Le compte courant d’un associé représente <b>ce que la SCI lui doit</b>. C’est une dette de la SCI envers l’associé, distincte de ses parts : les parts correspondent à sa part du capital de la SCI, le compte courant aux sommes qui lui reviennent mais qu’il n’a pas encore récupérées. Un solde positif dans ce tableau est donc une somme que la SCI devra un jour rendre à l’associé.</p>' +
  '<p><b>D’où vient-il ?</b> Chaque année, les loyers encaissés dépassent les charges et les intérêts d’emprunt : la SCI dégage un bénéfice comptable. Cet argent n’est pas versé aux associés, car il sert à rembourser le capital des emprunts bancaires, qui n’est pas une charge en comptabilité. Lors de l’affectation du résultat, une fois les comptes de l’année approuvés, ce bénéfice est donc inscrit au compte courant de chaque associé, <b>au prorata de ses parts</b>.</p>' +
  '<p style="background:#fff;border:1px solid var(--bord);border-radius:8px;padding:8px 12px"><b>Exemple.</b> La SCI a réalisé un bénéfice de 70 000 €. Un associé qui détient 36 parts sur 360, soit 10 %, voit son compte courant augmenter de 7 000 €. Année après année, ces montants s’additionnent.</p>' +
  '<p><b>Autres mouvements.</b> Une dépense personnelle réglée par erreur avec le compte de la SCI diminue le compte courant de l’associé concerné, et son remboursement le rétablit. De même, une somme avancée par un associé à la SCI augmente son compte courant, et le remboursement de cette avance le diminue.</p>' +
  '<p><b>Où est cet argent ?</b> Il n’est pas sur un compte en banque : il a servi à rembourser l’emprunt. Il se retrouve donc, en pratique, dans la valeur de l’immeuble.</p>' +
  '<p><b>Et les impôts ?</b> La SCI étant soumise à l’impôt sur le revenu, chaque associé est imposé chaque année sur sa part du revenu foncier de la SCI (déclaration 2072 de la SCI, à reporter sur sa propre déclaration 2044), que l’argent lui soit versé ou non. Le remboursement ultérieur du compte courant n’est donc pas imposé une seconde fois : c’est le remboursement d’une dette, pas un revenu.</p>' +
  '<p><b>Quand est-il remboursé ?</b> Quand la trésorerie de la SCI le permet, sur décision des associés ; lors d’une vente de parts, le compte courant est généralement racheté par le nouvel associé en plus du prix des parts ; enfin, à la vente de l’immeuble ou à la dissolution de la SCI. Les règles précises figurent dans les statuts et le pacte d’associés.</p>' +
  '<p style="margin-bottom:0"><b>Dans PibraCompta.</b> Le tableau ci-dessous donne le solde de chaque associé à la fin de l’exercice choisi en haut de l’écran ; un clic sur une ligne affiche le détail des mouvements. L’affectation annuelle du résultat se fait dans Comptabilité › Clôture.</p></details>';

/* ===== coffre.js ===== */
/* =====================================================================
   Coffre-fort des mots de passe de la SCI
   Chiffrement AES-256-GCM dans le navigateur ; clé dérivée (PBKDF2-SHA256,
   310 000 itérations) d'une phrase secrète connue des seuls associés.
   Le serveur et le classeur Google ne reçoivent que des données chiffrées.
   ===================================================================== */
var COFFRE = { cle: null, minuteur: null, DUREE: 10 * 60 * 1000, TEMOIN: 'PIBRACOMPTA-COFFRE-OK' };
var CATEGORIES_COFFRE = ['Banque', 'Impôts et administrations', 'Énergie et eau', 'Assurances', 'Comptable et juridique', 'Facture électronique', 'Fournisseurs et entretien', 'Google et messagerie', 'Autre'];
var COMPTES_HABITUELS = [
  ['BNP Paribas – banque en ligne de la SCI', 'Banque', 'https://mabanqueentreprise.bnpparibas'],
  ['impots.gouv.fr – espace professionnel', 'Impôts et administrations', 'https://cfspro.impots.gouv.fr'],
  ['EDF – espace client', 'Énergie et eau', 'https://entreprises-collectivites.edf.fr'],
  ['GAN Assurances – espace client', 'Assurances', 'https://www.gan.fr'],
  ['SOLUTEA / Solutions Expertise – portail client', 'Comptable et juridique', ''],
  ['Infogreffe', 'Comptable et juridique', 'https://www.infogreffe.fr'],
  ['Plateforme de facturation électronique', 'Facture électronique', ''],
  ['Google – scipibramedic@gmail.com', 'Google et messagerie', 'https://accounts.google.com']
];

function coffreActif() { return !!(DB.params.coffre_sel && DB.params.coffre_verif); }
function coffreVerrouiller() { COFFRE.cle = null; clearTimeout(COFFRE.minuteur); if (VUE === 'coffre') rendre(); }
function coffreRelancer() { clearTimeout(COFFRE.minuteur); if (COFFRE.cle) COFFRE.minuteur = setTimeout(function () { coffreVerrouiller(); toast('Coffre-fort verrouillé après 10 minutes d’inactivité.'); }, COFFRE.DUREE); }
['click', 'keydown', 'touchstart'].forEach(function (e) { document.addEventListener(e, function () { if (COFFRE.cle) coffreRelancer(); }, true); });

async function coffreDeriver(phrase, selB64) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(phrase.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bufferDepuisB64(selB64), iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function coffreChiffrer(cle, obj) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cle, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64DepuisBuffer(iv.buffer), donnees: b64DepuisBuffer(c) };
}
async function coffreDechiffrer(cle, iv, donnees) {
  var p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bufferDepuisB64(iv) }, cle, bufferDepuisB64(donnees));
  return JSON.parse(new TextDecoder().decode(p));
}
function genererMdp(n) {
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789-_!?%*+=#', r = crypto.getRandomValues(new Uint32Array(n || 20)), s = '';
  for (var i = 0; i < r.length; i++) s += a[r[i] % a.length];
  return s;
}
function copier(texte, quoi) {
  function secours() { var t = document.createElement('textarea'); t.value = texte; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast(quoi + ' copié.'); } catch (e) { toast('Copie impossible : affichez-le et recopiez-le.', true); } t.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(function () { toast(quoi + ' copié.'); }, secours); else secours();
}
function tracer(action, entree) { appel('tracer', { action: action, id: entree.id, detail: entree.titre }, { silencieux: true }).catch(function () { }); }

  $('#aj', c).onclick = function () { ficheCoffre({ categorie: etat.cat || 'Autre' }); };

function coffreCreation(c) {
  c.innerHTML = '<div class="carte" style="max-width:640px"><h3>Créer le coffre-fort de la SCI</h3>' +
    '<p>Le coffre-fort conserve les identifiants et mots de passe des comptes de la SCI (banque, impots.gouv, EDF, assurance, comptable, plateforme de factures…). Ils sont chiffrés avec une <b>phrase secrète commune</b> à tous les associés, choisie maintenant.</p>' +
    '<div class="alerte rouge">La phrase secrète n’est enregistrée nulle part, ni dans le logiciel ni chez Google. Notez-la sur papier et transmettez-la aux associés de vive voix. <b>Si elle est perdue, les mots de passe du coffre sont définitivement illisibles.</b></div>' +
    formulaire([{ k: 'p1', lib: 'Phrase secrète (12 caractères minimum, par exemple 4 ou 5 mots)', type: 'password', large: true }, { k: 'p2', lib: 'Confirmez la phrase secrète', type: 'password', large: true }]) +
    '<div class="barre" style="margin-top:12px"><button class="btn prim" id="cr">Créer le coffre-fort</button></div></div>';
  $('#cr', c).onclick = function () {
    var v = lireForm(c);

    if (v.p1 !== v.p2) return erreur(new Error('Les deux saisies sont différentes.'));
    var sel = b64DepuisBuffer(crypto.getRandomValues(new Uint8Array(16)).buffer);
    var att = chargement('Création du coffre…');
    coffreDeriver(v.p1, sel).then(function (cle) {
      return coffreChiffrer(cle, COFFRE.TEMOIN).then(function (t) {
        var p = { coffre_sel: sel, coffre_verif: JSON.stringify(t) };
        return appel('parametres', p, { silencieux: true }).then(function () { Object.assign(DB.params, p); COFFRE.cle = cle; coffreRelancer(); });
      });
    }).then(function () { att.remove(); toast('Coffre-fort créé.'); rendre(); }).catch(function (e) { att.remove(); erreur(e); });
  };
}

function ficheCoffre(e) {
  var nouveau = !e.id;
  (nouveau ? Promise.resolve({ identifiant: '', mdp: '', notes: '' }) : coffreDechiffrer(COFFRE.cle, e.iv, e.donnees)).then(function (d) {
    if (!nouveau) tracer('consultation', e);
    var champs = [
      { k: 'titre', lib: 'Compte', requis: true, large: true, ph: 'ex. EDF – espace client' },
      { k: 'categorie', lib: 'Catégorie', type: 'select', vide: false, options: optCoffre() },
      { k: 'url', lib: 'Adresse du site', ph: 'https://…' },

      { k: 'mdp', lib: 'Mot de passe', type: 'password' },

    ];
    var m = modal({ titre: nouveau ? 'Nouveau compte' : e.titre, large: true, corps: formulaire(champs, Object.assign({}, e, d)) +
      '<div class="barre" style="margin-top:10px"><button class="btn petit" id="voir">👁 Afficher le mot de passe</button><button class="btn petit" id="gen">Générer un mot de passe</button><button class="btn petit" id="cp">🔑 Copier le mot de passe</button>' + (e.url ? '<a class="btn petit" href="' + esc(e.url) + '" target="_blank" rel="noopener">Ouvrir le site</a>' : '') + '</div>' +
      (nouveau ? '' : '<p class="doux" style="font-size:12px">Dernière modification : ' + esc(e.maj_par) + ', le ' + dfr(e.maj_le) + '.</p>'),
      boutons: [nouveau ? null : { lib: 'Supprimer', danger: true, action: function () { return confirmer('Supprimer la fiche « ' + esc(e.titre) + ' » ?', 'Supprimer').then(function (o) { if (!o) return false; return supprimer('coffre', e.id).then(rendre); }); } },
        { lib: 'Fermer' },
        { lib: 'Enregistrer', prim: true, action: function (corps) {
          var v = lireForm(corps, champs);
          return coffreChiffrer(COFFRE.cle, { identifiant: v.identifiant, mdp: v.mdp, notes: v.notes }).then(function (ch) {
            return enregistrer('coffre', Object.assign({}, e, { titre: v.titre, categorie: v.categorie, url: v.url, iv: ch.iv, donnees: ch.donnees }));
          }).then(function () { toast('Enregistré (chiffré).'); rendre(); });
        } }].filter(Boolean) });
    var mdp = $('[name=mdp]', m.corps);
    $('#voir', m.corps).onclick = function () { var vis = mdp.type === 'password'; mdp.type = vis ? 'text' : 'password'; this.textContent = vis ? '🙈 Masquer' : '👁 Afficher le mot de passe'; if (vis && !nouveau) tracer('affichage mot de passe', e); };
    $('#gen', m.corps).onclick = function () { mdp.value = genererMdp(20); mdp.type = 'text'; };
    $('#cp', m.corps).onclick = function () { if (mdp.value) { copier(mdp.value, 'Mot de passe'); if (!nouveau) tracer('copie mot de passe', e); } };
  }).catch(function () { erreur(new Error('Fiche illisible avec cette phrase secrète.')); });
}

function changerPhrase() {
  modal({ titre: 'Changer la phrase secrète', corps: '<p>Toutes les fiches vont être rechiffrées avec la nouvelle phrase. Prévenez ensuite les autres associés de vive voix.</p>' + formulaire([{ k: 'p1', lib: 'Nouvelle phrase secrète (12 caractères minimum)', type: 'password', large: true }, { k: 'p2', lib: 'Confirmez', type: 'password', large: true }]),
    boutons: [{ lib: 'Annuler' }, { lib: 'Changer', prim: true, action: async function (corps) {
      var v = lireForm(corps);
      if (String(v.p1).length < 12) throw new Error('La phrase secrète doit comporter au moins 12 caractères.');
      if (v.p1 !== v.p2) throw new Error('Les deux saisies sont différentes.');
      var sel = b64DepuisBuffer(crypto.getRandomValues(new Uint8Array(16)).buffer);
      var nouvelle = await coffreDeriver(v.p1, sel);
      var lignes = [];
      for (var e of L('coffre')) { var d = await coffreDechiffrer(COFFRE.cle, e.iv, e.donnees); var ch = await coffreChiffrer(nouvelle, d); lignes.push(Object.assign({}, e, ch)); }
      var t = await coffreChiffrer(nouvelle, COFFRE.TEMOIN);
      var p = { coffre_sel: sel, coffre_verif: JSON.stringify(t) };
      DB.coffre = await appel('coffreRechiffrer', Object.assign({ lignes: lignes.map(function (l) { return { id: l.id, iv: l.iv, donnees: l.donnees }; }) }, p), { message: 'Rechiffrement…' });
      Object.assign(DB.params, p); COFFRE.cle = nouvelle; coffreRelancer();
      toast('Phrase secrète changée, ' + lignes.length + ' fiche(s) rechiffrée(s).'); rendre();
    } }] });
}

/* =====================================================================
   Photos de pièces : appareil photo du téléphone, compression, PDF
   multipage, lecture automatique (OCR Google Drive), rattachement à
   l'opération bancaire ou dépôt dans « À trier ».
   ===================================================================== */
var A_TRIER = 'À trier';
function ecranTactile() { try { return window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { return false; } }
function accepteImages(accept) { return !accept || /image/.test(accept); }
function horodatage() { var d = new Date(), p = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); }

// Compression d'une photo (grand côté 2000 px, JPEG 82 %) : envoi rapide même en 4G
function compresserImage(f) {
  if (!/^image\//.test(f.type) || /gif|svg/.test(f.type)) return Promise.resolve(f);
  return new Promise(function (ok) {
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var max = 2000, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));

// Assemble plusieurs photos en un seul PDF (une page par photo)
function photosEnPdf(fichiers, nom) {
  return lib('jspdf').then(function () {
    var pdf = null;
    return fichiers.reduce(function (p, f) {
      return p.then(function () {
        return new Promise(function (ok) {
          var url = URL.createObjectURL(f), img = new Image();
          img.onload = function () {
            var w = img.naturalWidth, h = img.naturalHeight, or = w > h ? 'l' : 'p';
            var largeur = or === 'p' ? 210 : 297, hauteur = or === 'p' ? 297 : 210, k = Math.min(largeur / w, hauteur / h);
            if (!pdf) pdf = new window.jspdf.jsPDF({ orientation: or, unit: 'mm', format: 'a4' }); else pdf.addPage('a4', or);
            pdf.addImage(img, 'JPEG', (largeur - w * k) / 2, (hauteur - h * k) / 2, w * k, h * k);
            URL.revokeObjectURL(url); ok();
          };
          img.src = url;
        });
      });
    }, Promise.resolve()).then(function () { return new File([pdf.output('blob')], nom || ('Document_' + horodatage() + '.pdf'), { type: 'application/pdf' }); });
  });
}

var SYNCHRO = { enCours: false };

// Traitement automatique : rapprochements, règles de classement, pièces en attente
var TRAITEMENT = { enCours: null };
function traitementAutomatique(silencieux) {
  if (TRAITEMENT.enCours) return TRAITEMENT.enCours;   // pas deux traitements en même temps
  TRAITEMENT.enCours = reparerDoublons().then(function () { return traitementAuto2(silencieux); });
  return TRAITEMENT.enCours.then(function (r) { TRAITEMENT.enCours = null; return r; }, function (e) { TRAITEMENT.enCours = null; throw e; });
}
// Retire les rapprochements en double (montant rapproché supérieur au virement)
function reparerDoublons() {
  var lpt = lettragesParTx();
  var trop = L('transactions').some(function (t) { var s = (lpt[t.id] || []).reduce(function (a, l) { return a + num(l.montant); }, 0); return Math.abs(s) > Math.abs(num(t.montant)) + 0.004; });
  if (!trop) return Promise.resolve(0);
  return appel('reparerLettrages', {}, { silencieux: true }).then(function (r) {
    (r.retires || []).forEach(function (id) { var x = DB.lettrages.find(function (l) { return l.id === id; }); if (x) x.supprime = '1'; });
    return (r.retires || []).length;
  }).catch(function () { return 0; });
}
function traitementAuto2(silencieux) {
  var lpt = lettragesParTx();
  var aTraiter = L('transactions').filter(function (t) { return etatTx(t, lpt) === 'à traiter'; });
  if (!aTraiter.length) return Promise.resolve({ lettrees: 0, classees: 0, pieces: 0 });
  var props = Compta.autoLettrage(DB, aTraiter, aujourdhui()).map(function (l) { l.id = nid('LT'); return l; });
  var res = { lettrees: new Set(props.map(function (l) { return l.transaction_id; })).size, classees: 0, pieces: 0 };
  return (props.length ? appel('inserer', { table: 'lettrages', lignes: props, motif: 'rapprochement automatique' }, { silencieux: true }).then(function (r) { majLocale('lettrages', r); }) : Promise.resolve())
    .then(function () {
      var lpt2 = lettragesParTx();
      var maj = L('transactions').filter(function (t) { return etatTx(t, lpt2) === 'à traiter'; }).map(function (t) { var k = Compta.suggererCategorie(DB, t); return k && k.indexOf('EMP:') !== 0 ? Object.assign({}, t, { categorie: k }) : null; }).filter(Boolean);
      res.classees = maj.length;
      return maj.length ? appel('enregistrerPlusieurs', { table: 'transactions', lignes: maj }, { silencieux: true }).then(function (r) { majLocale('transactions', r); }) : null;
    })
    .then(function () { return rattacherPiecesEnAttente(); }).then(function (n) { res.pieces = n; return res; });
}

    SYNCHRO.enCours = false; DB.banque = r.etat || DB.banque;

  return (occ ? '🔒 Seul l’occupant (' + occupantsLocal(lid).map(nomPersonne).join(', ') + ')' : '🔑 Au centre') + (com.length ? ' – ' + com.filter(function (c, i) { return com.indexOf(c) === i; }).join(' ; ') : '');
}
function fixerCreneau(s, c, toutes) {
  var interv = s.type === 'intervention', duree = +s.duree || 60;
  var fin = Agenda.hs(Math.min(Agenda.hm(c.debut) + duree, Agenda.hm(c.fin)));
  var ev = { type: interv ? 'intervention' : 'reunion', titre: s.titre, date: c.date, heure: c.debut, heure_fin: duree >= 480 ? c.fin : fin, sondage_id: s.id, rappels: JSON.stringify(['1:sem', '1:j']) };
  if (interv) {
    var occ = []; c.qui.forEach(function (l) { occupantsLocal(l).forEach(function (a) { if (occ.indexOf(a) < 0) occ.push(a); }); });
    if (s.intervenant) occ.push(s.intervenant);
    ev.participants = JSON.stringify(occ);
    ev.lieu = [DB.params.adresse, [DB.params.cp, DB.params.ville].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    var lignes = Agenda.pj(s.locaux, []).map(function (l) {
      var xs = toutes.filter(function (x) { return x.local_id === l && x.date === c.date; });
      return '• ' + ((byId('locaux', l) || {}).designation || l) + ' : ' + (c.qui.indexOf(l) < 0 ? 'NON ACCESSIBLE sur ce créneau' : 'salles : ' + sallesResume(xs) + ' ; clés : ' + clesResume(xs, l).replace(/^🔒 |^🔑 /, ''));
    });
    ev.notes = 'Accès aux locaux :\n' + lignes.join('\n');
    ev.ordre_du_jour = s.description || '';
  } else {
    ev.participants = s.participants;
    ev.ordre_du_jour = s.description || '';
    var p = c.details.filter(function (x) { return x.mode !== 'distanciel'; }).length, di = c.details.filter(function (x) { return x.mode === 'distanciel'; }).length;
    ev.modalite = di && p ? 'mixte' : di ? 'distanciel' : 'presentiel';
    ev.lieu = ev.modalite !== 'distanciel' ? 'Centre paramédical' : '';
  }
  formEvenement(ev, { inviter: true, apres: function (x) { enregistrer('sondages', { id: s.id, statut: 'clos', evenement_id: x.id }).catch(erreur); } });
}

// ---------- CONTACTS ----------
function formContact(c, apres) {
  var ch = [
    { k: 'civilite', lib: 'Civilité', type: 'select', options: [['M.', 'M.'], ['Mme', 'Mme']] }, { k: 'prenom', lib: 'Prénom' }, { k: 'nom', lib: 'Nom' },
    { k: 'categorie', lib: 'Catégorie', type: 'select', options: optContacts(), defaut: 'Autre' }, { k: 'fonction', lib: 'Fonction / rôle', ph: 'ex. secrétaire, chargé de clientèle…' },
    { k: 'societe', lib: 'Société / cabinet' }, { k: 'email', lib: 'E-mail', type: 'email' }, { k: 'telephone', lib: 'Téléphone' },
    { k: 'adresse', lib: 'Adresse', large: true }, { k: 'notes', lib: 'Notes', type: 'textarea', large: true }
  ];
  editer({ titre: c.id ? 'Contact' : 'Nouvelle personne', table: 'contacts', ligne: c, champs: ch, supprimable: true, large: true,
    avant: function (v) { if (!v.nom && !v.societe && !v.prenom) throw new Error('Indiquez au moins un nom ou une société.'); if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) throw new Error('Adresse e-mail incorrecte.'); return v; },
    apres: apres });
}
function agContacts(z, etat) {
  var q = Compta.normaliser(etat.q || '');
  var cs = trier(L('contacts'), function (a, b) { return String(a.categorie).localeCompare(b.categorie) || nomContact(a).localeCompare(nomContact(b)); })
    .filter(function (c) { return !q || Compta.normaliser([nomContact(c), c.categorie, c.fonction, c.email, c.telephone].join(' ')).indexOf(q) >= 0; });
  var lignes = [], cat = null;
  cs.forEach(function (c) { if (c.categorie !== cat) { cat = c.categorie; lignes.push({ _sep: esc(cat || 'Sans catégorie') }); } lignes.push(c); });
  var sansMail = Compta.associesOrdonnes(DB).filter(function (a) { return !emailAssocie(a); });
  var h = '<div class="barre"><button class="btn prim" id="ag-nc">+ Nouvelle personne</button><input type="search" id="ag-q" placeholder="Rechercher…" value="' + esc(etat.q || '') + '" style="max-width:260px"></div>' +
    '<p class="doux" style="font-size:12.5px;margin-top:0">Personnes à inviter en plus des associés : personnel du centre, comptable, assureur, banquier, entreprises… Leur adresse e-mail sert aux invitations et aux rappels.</p>' +
    (sansMail.length ? '<div class="alerte" style="cursor:pointer" id="ag-sm">Associé(s) sans adresse e-mail (ne recevront pas les rappels) : ' + esc(sansMail.map(nomA).join(', ')) + '. À compléter dans Associés.</div>' : '');
  h += tableau([
    { t: 'Nom', v: function (c) { return '<b>' + esc(nomContact(c)) + '</b>'; } },
    { t: 'Fonction', mob: false, v: function (c) { return esc(c.fonction); } },
    { t: 'E-mail', v: function (c) { return c.email ? '<a href="mailto:' + esc(c.email) + '" onclick="event.stopPropagation()">' + esc(c.email) + '</a>' : '<span class="doux">—</span>'; } },
    { t: 'Téléphone', v: function (c) { return c.telephone ? '<a href="tel:' + esc(String(c.telephone).replace(/\s/g, '')) + '" onclick="event.stopPropagation()">' + esc(c.telephone) + '</a>' : ''; } }
  ], lignes, { clic: 1, vide: 'Aucun contact pour l’instant.', mobListe: function (c) { return '<b>' + esc(nomContact(c)) + '</b><div class="doux" style="font-size:12.5px">' + esc([c.fonction, c.email, c.telephone].filter(Boolean).join(' · ')) + '</div>'; } });
  z.innerHTML = h;
  $('#ag-nc', z).onclick = function () { formContact({ categorie: 'Autre' }); };
  var qi = $('#ag-q', z); qi.oninput = function () { etat.q = qi.value; clearTimeout(qi._t); qi._t = setTimeout(function () { rendre(); var n = $('#ag-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 300); };
  if ($('#ag-sm', z)) $('#ag-sm', z).onclick = function () { aller('associes'); };
  brancherClics(z, lignes, function (c) { if (!c._sep) formContact(c); });
}

// ---------- tableau de bord ----------
function alertesAgenda() {
  var out = [], auj = aujourdhui();
  var retard = L('evenements').filter(function (e) { return e.type === 'tache'; }).filter(function (ev) {
    var p = Agenda.occurrences(ev, Agenda.plusJours(auj, -366), Agenda.plusJours(auj, -1)), der = p[p.length - 1];
    return der && Agenda.pj(ev.faits, []).indexOf(der) < 0;
  });
  if (retard.length) out.push(['rouge', '<b>' + retard.length + ' rappel(s) ou tâche(s) en retard</b> : ' + esc(retard.slice(0, 3).map(function (e) { return e.titre; }).join(', ')) + (retard.length > 3 ? '…' : '') + '.', 'agenda', { onglet: 'faire' }]);
  L('sondages').filter(function (s) { return sondageOuvert(s) && concerneMoi(s) && !aRepondu(s); }).forEach(function (s) {
    out.push(['bleu', (s.type === 'intervention' ? '<b>Accès à votre local demandé</b> pour « ' : '<b>Vos disponibilités sont demandées</b> pour « ') + esc(s.titre) + ' » (avant le ' + dfr(s.date_limite) + ').', 'agenda', { onglet: 'dispos', sondage: s.id, brouillon: null }]);
  });
  return out;
}
function prochainsEvenements(n) { var auj = aujourdhui(); return Agenda.planning(L('evenements'), auj, Agenda.plusJours(auj, 60)).filter(function (o) { return !o.fait; }).slice(0, n || 3); }

// ---------- PAGE PUBLIQUE DE RÉPONSE (lien personnel reçu par e-mail, sans compte) ----------
var DISPO = null;
function cleDispoUrl() { var q = new URLSearchParams(location.search).get('dispo'); return q || (typeof PIBRA_DISPO !== 'undefined' ? PIBRA_DISPO : ''); }
function ecranDispo(cle) {
  return appel('dispoLire', { cle: cle }, { message: 'Chargement…' }).then(function (r) {
    var interv = r.sondage.type === 'intervention';
    DISPO = { cle: cle, r: r, interv: interv, n: 0, liste: r.dispos.filter(function (x) { return x.date; }).map(function (x, i) { x._k = 'e' + i; return x; }), aucune: r.dispos.some(function (x) { return x.mode === 'aucune'; }), mode: 'presentiel', local: (r.locaux[0] || {}).id, reglages: {}, envoye: false };
    r.locaux.forEach(function (l) { var ex = r.dispos.filter(function (x) { return x.local_id === l.id && x.date; })[0]; DISPO.reglages[l.id] = { cles: ex ? ex.cles || 'centre' : 'centre', salles: ex ? Agenda.pj(ex.salles, []) : [], com: ex ? ex.commentaire || '' : '' }; });
    rendreDispo();
  }).catch(function (e) {
    document.body.innerHTML = '<div class="connexion"><div class="carte" style="max-width:480px"><div class="logo" style="padding:0">' + LOGO + '<div><b>PibraCompta</b><small>SCI PIBRAMEDIC</small></div></div><h1>Lien indisponible</h1><div class="alerte rouge">' + esc(e.message) + '</div><a class="btn" href="' + esc(location.pathname) + '">Ouvrir PibraCompta</a></div></div>';
  });
}
function rendreDispo() {
  var D = DISPO, r = D.r, s = r.sondage, interv = D.interv, auj = r.aujourdhui || aujourdhui();
  var hmin = s.heure_min || '08:00', hmax = s.heure_max || '20:00', reg = interv ? D.reglages[D.local] : null;
  var loc = interv ? r.locaux.filter(function (l) { return l.id === D.local; })[0] : null, sl = loc ? sallesLocal(loc) : [];
  var h = '<div class="connexion dispo-page"><div class="carte" style="max-width:720px">' +
    '<div class="logo" style="padding:0">' + LOGO + '<div><b>PibraCompta</b><small>' + esc(r.societe) + '</small></div></div>' +
    '<h1>' + esc(s.titre) + '</h1><p class="doux" style="margin:2px 0 12px">' + (interv ? 'Intervention dans les locaux' + (s.intervenant ? ' – ' + esc(s.intervenant) : '') : 'Préparation de réunion') + '</p>' +
    '<p>Bonjour ' + esc(r.nom) + ',</p><p>' + (interv
      ? 'Indiquez quand ' + (r.locaux.length > 1 ? 'vos locaux sont accessibles' : 'votre local est accessible') + ', quelles salles sont concernées et où seront les clés.'
      : 'Indiquez vos disponibilités : pour chaque jour possible, ajoutez une plage horaire et précisez si vous pouvez venir <b>en présentiel</b>, <b>à distance</b>, ou <b>les deux</b>.') + '</p>' +
    '<div class="alerte bleu">Dates proposées du <b>' + esc(Agenda.dateLongue(s.date_debut)) + '</b> au <b>' + esc(Agenda.dateLongue(s.date_limite)) + '</b> (date butoir), entre ' + esc(Agenda.hFr(hmin)) + ' et ' + esc(Agenda.hFr(hmax)) + '. Durée prévue : ' + esc(Agenda.libelle([['30', '30 min'], ['60', '1 h'], ['90', '1 h 30'], ['120', '2 h'], ['180', '3 h'], ['240', '4 h'], ['480', 'une journée']], String(s.duree))) + '.</div>' +
    (s.description ? '<div class="ag-texte" style="margin-bottom:10px">' + esc(s.description) + '</div>' : '') +
    (r.fixe ? '<div class="alerte vert">La date est fixée : <b>' + esc(Agenda.dateLongue(r.fixe.date)) + (r.fixe.heure ? ' à ' + esc(Agenda.hFr(r.fixe.heure)) : '') + '</b>' + (r.fixe.lieu ? ' – ' + esc(r.fixe.lieu) : '') + '.</div>' : '');
  if (D.envoye) {
    h += '<div class="alerte vert"><b>Merci, c’est enregistré.</b> ' + (D.aucune ? 'Vous avez indiqué n’être disponible à aucune de ces dates.' : D.liste.length + ' créneau(x) transmis.') + ' Vous pouvez revenir sur ce lien pour les modifier jusqu’au ' + esc(dfr(s.date_limite)) + '.</div><button class="btn" id="dp-mod">Modifier mes réponses</button>';
  } else if (!r.ouvert) {
    h += '<div class="alerte">Cette demande est close : les réponses ne peuvent plus être modifiées.</div>' + resumeDispo();
  } else {
    if (interv) {
      if (r.locaux.length > 1) h += '<label class="champ"><span>Local</span><select id="dp-loc">' + r.locaux.map(function (l) { return '<option value="' + esc(l.id) + '"' + (l.id === D.local ? ' selected' : '') + '>' + esc(l.designation) + '</option>'; }).join('') + '</select></label>';
      else h += '<p><b>' + esc(loc.designation) + '</b></p>';
      h += '<div class="dp-etape"><b>Clés</b><div class="chips" style="margin-top:6px"><span class="chip' + (reg.cles === 'centre' ? ' actif' : '') + '" data-dc="centre">🔑 Disponibles au centre</span><span class="chip' + (reg.cles === 'occupant' ? ' actif' : '') + '" data-dc="occupant">🔒 Je suis seul(e) à avoir les clés</span></div>' +
        '<b style="display:block;margin-top:10px">Salles accessibles</b><div class="chips" style="margin-top:6px"><span class="chip' + (!reg.salles.length ? ' actif' : '') + '" data-ds="">Toutes les salles</span>' + sl.map(function (x) { return '<span class="chip' + (reg.salles.indexOf(x) >= 0 ? ' actif' : '') + '" data-ds="' + esc(x) + '">' + esc(x) + '</span>'; }).join('') + '</div>' +
        '<label class="champ" style="margin-top:10px"><span>Commentaire (facultatif)</span><input type="text" id="dp-com" value="' + esc(reg.com) + '" placeholder="ex. prévenir la veille, clés au secrétariat…"></label></div>';
    }
    h += '<div class="dp-etape"><b>' + (interv ? 'Créneaux où le local est accessible' : 'Mes disponibilités, jour par jour') + '</b>' +
      (interv ? '' : '<p class="doux" style="font-size:12.5px;margin:4px 0 0">Ajoutez autant de créneaux que vous voulez pour chaque jour, puis choisissez pour chacun <b>🏢 Présentiel</b>, <b>💻 Distanciel</b> ou <b>Les deux</b>. Les heures se modifient directement.</p>');
    var jours = [];
    for (var d = s.date_debut < auj ? auj : s.date_debut; d <= s.date_limite; d = Agenda.plusJours(d, 1)) jours.push(d);
    h += '<div class="' + (D.aucune ? 'dp-off' : '') + '">' + htmlJoursCreneaux(jours, D.liste.filter(function (x) { return !interv || x.local_id === D.local; }), interv) + '</div></div>';
    h += '<label class="case" style="margin:12px 0"><input type="checkbox" id="dp-aucune"' + (D.aucune ? ' checked' : '') + '> ' + (interv ? 'Le local n’est accessible à aucune de ces dates' : 'Je ne suis disponible à aucune de ces dates') + '</label>' +
      '<div class="ag-enreg" style="bottom:0"><button class="btn prim" id="dp-env" style="padding:10px 18px">Envoyer mes réponses</button><span class="doux" style="font-size:12.5px;align-self:center">' + D.liste.length + ' créneau(x)</span></div>';
  }
  h += '<p class="doux" style="font-size:12px;margin-top:16px">Ce lien vous est personnel. <a href="' + esc(location.pathname) + '">Ouvrir PibraCompta</a> (associés)</p></div></div>';
  document.body.innerHTML = h;
  var b = document.body;
  function ajouterP(d, a, z, focus) {
    if (D.liste.some(function (y) { return y.date === d && (!interv || y.local_id === D.local) && y.heure_debut === a && y.heure_fin === z; })) return;
    var x = { _k: 'k' + (++DISPO.n), date: d, heure_debut: a, heure_fin: z };
    if (interv) { x.local_id = D.local; x.cles = reg.cles; x.salles = reg.salles.slice(); x.commentaire = reg.com; } else x.mode = D.mode;
    D.liste.push(x); D.aucune = false; rendreDispo();
    if (focus) focusDernier(document.body, d);
  }
  brancherCreneaux(b, {
    ajouter: ajouterP,
    retirer: function (k) { D.liste = D.liste.filter(function (y) { return y._k !== k; }); rendreDispo(); },
    maj: function (k, c, v) { var x = D.liste.filter(function (y) { return y._k === k; })[0]; if (!x) return; x[c] = v; if (c === 'mode') D.mode = v; rendreDispo(); },
    liste: function (d) { return D.liste.filter(function (y) { return y.date === d && (!interv || y.local_id === D.local); }); }
  }, hmin, hmax);
  $$('[data-dc]', b).forEach(function (c) { c.onclick = function () { reg.cles = c.dataset.dc; D.liste.forEach(function (x) { if (x.local_id === D.local) x.cles = reg.cles; }); rendreDispo(); }; });
  $$('[data-ds]', b).forEach(function (c) { c.onclick = function () { var v = c.dataset.ds; if (!v) reg.salles = []; else { var i = reg.salles.indexOf(v); if (i >= 0) reg.salles.splice(i, 1); else reg.salles.push(v); } D.liste.forEach(function (x) { if (x.local_id === D.local) x.salles = reg.salles.slice(); }); rendreDispo(); }; });
  if ($('#dp-com')) $('#dp-com').oninput = function () { reg.com = this.value; D.liste.forEach(function (x) { if (x.local_id === D.local) x.commentaire = reg.com; }); };
  if ($('#dp-loc')) $('#dp-loc').onchange = function () { D.local = this.value; rendreDispo(); };
  if ($('#dp-aucune')) $('#dp-aucune').onchange = function () { D.aucune = this.checked; if (D.aucune) D.liste = D.liste.filter(function (x) { return interv && x.local_id !== D.local; }); rendreDispo(); };
  if ($('#dp-mod')) $('#dp-mod').onclick = function () { D.envoye = false; rendreDispo(); };
  if ($('#dp-env')) $('#dp-env').onclick = function () {
    var pb = erreurCreneaux(D.liste.filter(function (x) { return !interv; })) || (interv ? r.locaux.map(function (l) { return erreurCreneaux(D.liste.filter(function (x) { return x.local_id === l.id; })); }).filter(Boolean)[0] || '' : '');
    if (pb) return erreur(new Error(pb));
    if (!D.liste.length && !D.aucune) return erreur(new Error('Ajoutez au moins un créneau, ou cochez « ' + (interv ? 'Le local n’est accessible à aucune de ces dates' : 'Je ne suis disponible à aucune de ces dates') + ' ».'));
    var envoi = D.liste.map(function (x) { var y = Object.assign({}, x); delete y._k; return y; });
    if (D.aucune) (interv ? [D.local] : ['']).forEach(function (l) { envoi.push({ aucune: 1, local_id: l }); });
    appel('dispoEnregistrer', { cle: D.cle, dispos: envoi }, { message: 'Envoi…' }).then(function () { D.envoye = true; rendreDispo(); window.scrollTo(0, 0); }).catch(erreur);
  };
}
function resumeDispo() {
  var D = DISPO;
  if (D.aucune && !D.liste.length) return '<p>Réponse : aucune disponibilité.</p>';
  return '<ul>' + D.liste.slice().sort(function (a, b) { return (a.date + a.heure_debut).localeCompare(b.date + b.heure_debut); }).map(function (x) { return '<li>' + esc(jourCourt(x.date) + ' : ' + plageFr(x.heure_debut, x.heure_fin)) + ' ' + (D.interv ? (x.cles === 'occupant' ? '🔒' : '🔑') : modeIcone(x.mode)) + '</li>'; }).join('') + '</ul>';
}
