<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>PibraCompta – SCI PIBRAMEDIC</title>
<style>
:root{
  --bleu:#d6e8fa;--bleu-f:#3d7cc9;--vert:#d7f0e1;--vert-f:#2f9a5f;--orange:#fde4cc;--orange-f:#d07a2b;--violet:#e6dcf7;--violet-f:#7a5bc0;
  --rose:#f9dbe6;--rose-f:#c4507b;--jaune:#fbf1c7;--jaune-f:#b08a12;--teal:#d2f0ef;--teal-f:#2a9893;--gris:#eef1f5;--gris-f:#5d6b7e;
  --rouge:#fbe0de;--rouge-f:#c9443b;--texte:#1f2a37;--doux:#6b7686;--bord:#e3e7ee;--fond:#ffffff;--fond2:#f7f9fb;--accent:#3d7cc9;
  --r:10px;--ombre:0 1px 3px rgba(20,30,50,.07),0 4px 14px rgba(20,30,50,.05)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;height:100vh;height:100dvh}
.nav{width:228px;flex:none;border-right:1px solid var(--bord);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;background:var(--fond)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo svg{flex:none}.logo b{font-size:16px;letter-spacing:.2px}.logo small{display:block;color:var(--doux);font-size:11px;line-height:1.2}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--texte);cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--fond2)}
.nav a.actif{background:var(--fond2);font-weight:600}
.pastille{width:10px;height:10px;border-radius:3px;flex:none}
.nav .bas{margin-top:auto;padding:10px;color:var(--doux);font-size:12px;border-top:1px solid var(--bord)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.entete{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--bord);min-height:56px}
.entete h1{font-size:18px;margin:0;font-weight:650;display:flex;align-items:center;gap:10px}
.entete .esp{flex:1}
.contenu{flex:1;overflow-y:auto;padding:18px 22px 90px}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.carte{background:var(--fond);border:1px solid var(--bord);border-radius:var(--r);padding:14px 16px;box-shadow:var(--ombre);position:relative}
.carte h3{margin:0 0 8px;font-size:13px;color:var(--doux);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.carte .gros{font-size:24px;font-weight:650;letter-spacing:-.3px}
.carte .sous{color:var(--doux);font-size:12.5px}
.carte.marque{border-left:4px solid var(--c,var(--bord))}
.bloc{margin:18px 0}
.bloc>h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.barre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--bord);background:var(--fond);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--texte)}
.btn:hover{background:var(--fond2)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{filter:brightness(1.07)}
.btn.danger{color:var(--rouge-f);border-color:#f1c4c0}
.btn.petit{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--bord);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.onglets a{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--doux);white-space:nowrap;text-decoration:none}
.onglets a.actif{color:var(--texte);border-color:var(--c,var(--accent));font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--bord);border-radius:8px;padding:7px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd6f5;border-color:#9cc2ee}
textarea{min-height:70px;resize:vertical}
label.champ{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--doux)}
label.champ>span{font-weight:550}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.form .large{grid-column:1/-1}
.case{display:flex;align-items:center;gap:8px;cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--fond2);text-align:left;font-weight:600;color:var(--doux);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--bord);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--bord);vertical-align:top}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:#fafcff}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:650;background:var(--fond2)}
table.t tr.sep td{background:var(--fond2);font-weight:600;color:var(--doux)}
.tab-wrap{overflow:auto;border:1px solid var(--bord);border-radius:var(--r);max-height:70vh}
.puce{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-vert{background:var(--vert);color:#1f6b42}.p-orange{background:var(--orange);color:#8a4c12}.p-rouge{background:var(--rouge);color:#9b2c25}
.p-gris{background:var(--gris);color:var(--gris-f)}.p-bleu{background:var(--bleu);color:#245a99}.p-violet{background:var(--violet);color:#583f99}.p-jaune{background:var(--jaune);color:#7d6107}
.pos{color:var(--vert-f)}.neg{color:var(--rouge-f)}.doux{color:var(--doux)}.gras{font-weight:650}
.alerte{display:block;padding:10px 12px;border-radius:8px;background:var(--jaune);margin-bottom:8px;font-size:13px}
.alerte.rouge{background:var(--rouge)}.alerte.bleu{background:var(--bleu)}.alerte.vert{background:var(--vert)}
.modal-fond{position:fixed;inset:0;background:rgba(20,30,45,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.large{max-width:1100px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bord)}
.modal header h2{margin:0;font-size:16px;flex:1}
.modal .corps{padding:16px 18px;overflow-y:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--bord);flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--doux);line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:#9b2c25}
.charge{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);z-index:90;flex-direction:column;gap:10px;color:var(--doux)}
.rond{width:34px;height:34px;border:3px solid var(--bleu);border-top-color:var(--accent);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.grille-loyers td.m{text-align:center;padding:4px 3px;min-width:52px}
.grille-loyers .cel{display:block;border-radius:6px;padding:4px 2px;font-size:11.5px;cursor:pointer;font-weight:600}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--doux);margin:8px 0}
.connexion{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#f3f8fe,#fbf7fd)}
.connexion .carte{width:100%;max-width:400px;padding:26px}
.connexion h1{font-size:20px;margin:6px 0 2px}
.depot{border:2px dashed #c9d6e6;border-radius:12px;padding:22px;text-align:center;color:var(--doux);cursor:pointer;background:var(--fond2)}
.depot.survol{border-color:var(--accent);background:var(--bleu)}
.liste-mob{display:none}
.ligne-mob{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bord);align-items:center;cursor:pointer}
.ligne-mob .l1{flex:1;min-width:0}
.ligne-mob .l1 div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apercu{width:100%;height:70vh;border:1px solid var(--bord);border-radius:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--doux)}.kv dd{margin:0}
.barres{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
.barres .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--doux);gap:3px;min-width:0}
.barres .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--jaune-f);opacity:.75}
.barres .b i.neg{background:var(--rouge-f)}
.mobile-nav{display:none}
.fab{display:none}
.vide{padding:28px;text-align:center;color:var(--doux)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:20px;border:1px solid var(--bord);cursor:pointer;font-size:12.5px;background:#fff}
.chip.actif{background:var(--texte);color:#fff;border-color:var(--texte)}
.sugg{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bord);border-radius:8px;margin-bottom:6px;cursor:pointer}
.sugg:hover{background:var(--vert)}
details.aide{background:var(--fond2);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
details.aide summary{cursor:pointer;font-weight:600}
@media (max-width:900px){
  .nav{display:none}
  .entete{padding:10px 14px;min-height:50px;position:sticky;top:0;background:#fff;z-index:5}
  .entete h1{font-size:16px}
  .contenu{padding:12px 12px 96px}
  .grille{grid-template-columns:1fr 1fr;gap:10px}
  .carte{padding:12px}
  .carte .gros{font-size:19px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bord);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobile-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--doux);text-decoration:none;cursor:pointer;padding:3px 0}
  .mobile-nav a.actif{color:var(--texte);font-weight:650}
  .mobile-nav .pastille{width:18px;height:6px;border-radius:4px}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:26px;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(30,60,110,.35);z-index:25;cursor:pointer}
  .cache-mob{display:none!important}
  .liste-mob{display:block}
  .tab-wrap.mob-liste{display:none}
  .modal-fond{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:16px 16px 0 0}
  .form{grid-template-columns:1fr 1fr}
  .btn{padding:8px 12px}
}
@media (max-width:420px){.grille{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
@media print{.nav,.mobile-nav,.entete .btn,.barre{display:none!important}.contenu{overflow:visible}}

</style>

<body>
<div class="charge"><div class="rond"></div><div>Chargement de PibraCompta…</div></div>
<script>
/* ===== compta.js ===== */
/* =====================================================================
   PibraCompta — moteur comptable (partagé : navigateur + tests Node)
   SCI à l'IR, sans TVA. Montants en euros, calculs en centimes.
   ===================================================================== */
var Compta = (function () {
  'use strict';

  // ---------- utilitaires ----------
  function num(x) {
    if (typeof x === 'number') return isFinite(x) ? x : 0;
    if (x === null || x === undefined || x === '') return 0;
    var s = String(x).replace(/[\s  €]/g, '');
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
      // 1.234,56 ou 1,234.56
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else s = s.replace(',', '.');
    var n = Number(s);
    return isFinite(n) ? n : 0;
  }
  function c(x) { return Math.round(num(x) * 100); }          // en centimes
  function r2(x) { return Math.round(num(x) * 100) / 100; }
  function eur(x, opt) {
    var v = r2(x);
    var s = v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (opt && opt.signe && v > 0 ? '+' : '') + s + ' €';
  }
  function annee(d) { return String(d || '').slice(0, 4); }
  function vivant(r) { return r && String(r.supprime || '') !== '1' && r.supprime !== true; }
  function L(DB, t) { return (DB[t] || []).filter(vivant); }
  function byId(DB, t, id) { return L(DB, t).find(function (r) { return String(r.id) === String(id); }); }
  function finMois(p) { var y = +p.slice(0, 4), m = +p.slice(5, 7); var d = new Date(Date.UTC(y, m, 0)); return p + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  function addMonths(dateStr, n) {
    var y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7) - 1, d = +dateStr.slice(8, 10);
    var t = new Date(Date.UTC(y, m + n, 1));
    var last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    t.setUTCDate(Math.min(d, last));
    return t.toISOString().slice(0, 10);
  }
  function jours(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
  function parseJSON(s, def) { if (!s) return def; if (typeof s !== 'string') return s; try { return JSON.parse(s); } catch (e) { return def; } }

  // ---------- comptes système ----------
  var SYS = {
    BANQUE: '512000', CLIENTS: '411000', FOURN: '401000', ATTENTE: '471000', VIR: '580000',
    RESULTAT: '120000', CAPITAL: '101300', RESERVE: '106100', REPORT: '110000',
    LOYERS: '706000', REFACT_CH: '708300', REFACT_TF: '708400', AUTRES_PROD: '708800',
    INTERETS: '661100', ASSUR_EMP: '616100', DEPOT: '165000'
  };
  var LIB_FIXES = {
    '211000': 'Terrains', '213000': 'Constructions', '101300': 'Capital social', '106100': 'Réserve légale',
    '110000': 'Report à nouveau', '120000': "Résultat de l'exercice", '129000': "Résultat de l'exercice (perte)",
    '165000': 'Dépôts de garantie reçus', '401000': 'Fournisseurs', '401700': 'Fournisseurs – retenues de garantie',
    '411000': 'Clients (locataires)', '471000': "Compte d'attente", '580000': 'Virements internes',
    '512000': 'Banque', '706000': 'Loyers', '708300': 'Charges locatives refacturées', '708400': 'Taxe foncière refacturée',
    '708800': 'Autres produits refacturés', '661100': "Intérêts d'emprunts", '616100': 'Assurance emprunteur'
  };

  function comptesLibelles(DB) {
    var m = Object.assign({}, LIB_FIXES);
    L(DB, 'categories').forEach(function (k) { if (k.compte) m[String(k.compte)] = k.libelle; });
    L(DB, 'associes').forEach(function (a) { if (a.compte_courant) m[String(a.compte_courant)] = 'Compte courant ' + nomAssocie(a); });
    L(DB, 'emprunts').forEach(function (e) { if (e.compte) m[String(e.compte)] = 'Emprunt ' + e.libelle; });
    L(DB, 'comptes').forEach(function (b) { if (b.compte_comptable) m[String(b.compte_comptable)] = b.nom; });
    return m;
  }
  function nomAssocie(a) { return a ? ((a.prenom ? a.prenom + ' ' : '') + (a.nom || '')).trim() : ''; }

  // ---------- parts sociales ----------
  function partsA(DB, associeId, date) {
    var rows = L(DB, 'parts').filter(function (p) { return String(p.associe_id) === String(associeId) && String(p.date_effet) <= date; })
      .sort(function (x, y) { return String(x.date_effet).localeCompare(String(y.date_effet)); });
    return rows.length ? num(rows[rows.length - 1].nb_parts) : 0;
  }
  function associesOrdonnes(DB) {
    return L(DB, 'associes').slice().sort(function (a, b) { return num(a.ordre) - num(b.ordre) || String(a.nom).localeCompare(String(b.nom)); });
  }
  // Répartition des parts pour une année : à la clôture (défaut) ou prorata temporis
  function poidsAnnee(DB, an) {
    var mode = (DB.params && DB.params.repartition_mode) || 'cloture';
    var fin = an + '-12-31', deb = an + '-01-01';
    return associesOrdonnes(DB).map(function (a) {
      var w;
      if (mode === 'prorata') {
        // somme des parts jour par jour
        var dates = L(DB, 'parts').filter(function (p) { return String(p.associe_id) === String(a.id); })
          .map(function (p) { return String(p.date_effet); }).filter(function (d) { return d > deb && d <= fin; }).sort();
        var points = [deb].concat(dates), tot = 0;
        for (var i = 0; i < points.length; i++) {
          var d0 = points[i], d1 = i + 1 < points.length ? points[i + 1] : addMonths(fin, 0);
          var nbj = i + 1 < points.length ? jours(d0, d1) : jours(d0, fin) + 1;
          tot += partsA(DB, a.id, d0) * nbj;
        }
        w = tot / (jours(deb, fin) + 1);
      } else w = partsA(DB, a.id, fin);
      return { id: a.id, associe: a, parts: w };
    }).filter(function (x) { return x.parts > 0; });
  }
  // Arrondi de chaque quote-part, écart d'arrondi porté sur le dernier associé (méthode du cabinet comptable)
  function repartir(total, poids, sansAjustement) {
    var T = c(total), W = poids.reduce(function (s, p) { return s + p.parts; }, 0);
    if (!W) return poids.map(function () { return 0; });
    var res = poids.map(function (p) { return Math.round(T * p.parts / W); });
    var ecart = T - res.reduce(function (s, x) { return s + x; }, 0);
    if (res.length && !sansAjustement) res[res.length - 1] += ecart;
    return res.map(function (x) { return x / 100; });
  }

  // ---------- catégories ----------
  function categorie(DB, id) {
    if (!id) return null;
    var k = byId(DB, 'categories', id);
    if (k) return k;
    var s = String(id);
    if (s.indexOf('CCA:') === 0) {
      var a = byId(DB, 'associes', s.slice(4));
      if (a) return { id: s, libelle: 'Compte courant ' + nomAssocie(a), compte: a.compte_courant, type: 'bilan', groupe: 'Associés' };
    }
    if (s.indexOf('EMP:') === 0) {
      var e = byId(DB, 'emprunts', s.slice(4));
      if (e) return { id: s, libelle: 'Échéance ' + e.libelle, compte: e.compte, type: 'emprunt', groupe: 'Emprunts', emprunt: e };
    }
    if (s.indexOf('BAIL:') === 0) {
      var b = byId(DB, 'baux', s.slice(5));
      if (b) return { id: s, libelle: 'Règlement ' + b.locataire, compte: SYS.CLIENTS, aux: b.code_client, type: 'bail', groupe: 'Loyers' };
    }
    return null;
  }
  function toutesCategories(DB) {
    var out = L(DB, 'categories').filter(function (k) { return String(k.actif) !== '0'; }).slice();
    associesOrdonnes(DB).forEach(function (a) { out.push(categorie(DB, 'CCA:' + a.id)); });
    L(DB, 'emprunts').forEach(function (e) { out.push(categorie(DB, 'EMP:' + e.id)); });
    L(DB, 'baux').filter(function (b) { return String(b.actif) !== '0'; }).forEach(function (b) { out.push(categorie(DB, 'BAIL:' + b.id)); });
    return out.filter(Boolean);
  }

  // ---------- emprunts ----------
  function echeancierEmprunt(DB, emp) {
    var rows = L(DB, 'emprunt_echeances').filter(function (x) { return String(x.emprunt_id) === String(emp.id); })
      .map(function (x) { return { id: x.id, date: x.date, capital: num(x.capital), interets: num(x.interets), assurance: num(x.assurance), crd: num(x.crd), importe: true }; })

  function isoDepuisExcel(v) {

  // Empreinte stable entre formats : date | montant en centimes | rang du doublon dans la journée

  // ---------- OFX (BNP, BoursoBank, la plupart des banques) ----------

  }

  // ---------- tableaux (XLS/XLSX/CSV) : repérage automatique des colonnes ----------
  function trouverColonnes(rows) {
    for (var i = 0; i < Math.min(rows.length, 25); i++) {
      var h = rows[i].map(function (x) { return Compta.normaliser(x); });
      var idx = function () { for (var a = 0; a < arguments.length; a++) for (var j = 0; j < h.length; j++) if (arguments[a].test(h[j])) return j; return -1; };

  function tableau(rows, format) {

    for (var i = 0; i < Math.min(rows.length, 30); i++) {
      var h = rows[i].map(function (x) { return Compta.normaliser(x); });

      var ed = tous('ExchangedDocument')[0];
      f.numero = ed ? un('ID', ed) : '';

/* =====================================================================
   Coffre-fort des mots de passe de la SCI
   Chiffrement AES-256-GCM dans le navigateur ; clé dérivée (PBKDF2-SHA256,
   310 000 itérations) d'une phrase secrète connue des seuls associés.
   Le serveur et le classeur Google ne reçoivent que des données chiffrées.

var COFFRE = { cle: null, minuteur: null, DUREE: 10 * 60 * 1000, TEMOIN: 'PIBRACOMPTA-COFFRE-OK' };
var CATEGORIES_COFFRE = ['Banque', 'Impôts et administrations', 'Énergie et eau', 'Assurances', 'Comptable et juridique', 'Facture électronique', 'Fournisseurs et entretien', 'Google et messagerie', 'Autre'];

  ['BNP Paribas – banque en ligne de la SCI', 'Banque', 'https://mabanqueentreprise.bnpparibas'],
  ['impots.gouv.fr – espace professionnel', 'Impôts et administrations', 'https://cfspro.impots.gouv.fr'],
  ['EDF – espace client', 'Énergie et eau', 'https://entreprises-collectivites.edf.fr'],
  ['GAN Assurances – espace client', 'Assurances', 'https://www.gan.fr'],
  ['SOLUTEA / Solutions Expertise – portail client', 'Comptable et juridique', ''],
  ['Infogreffe', 'Comptable et juridique', 'https://www.infogreffe.fr'],

function coffreActif() { return !!(DB.params.coffre_sel && DB.params.coffre_verif); }
function coffreVerrouiller() { COFFRE.cle = null; clearTimeout(COFFRE.minuteur); if (VUE === 'coffre') rendre(); }
function coffreRelancer() { clearTimeout(COFFRE.minuteur); if (COFFRE.cle) COFFRE.minuteur = setTimeout(function () { coffreVerrouiller(); toast('Coffre-fort verrouillé après 10 minutes d’inactivité.'); }, COFFRE.DUREE); }
['click', 'keydown', 'touchstart'].forEach(function (e) { document.addEventListener(e, function () { if (COFFRE.cle) coffreRelancer(); }, true); });

async function coffreDeriver(phrase, selB64) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(phrase.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bufferDepuisB64(selB64), iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function coffreChiffrer(cle, obj) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cle, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64DepuisBuffer(iv.buffer), donnees: b64DepuisBuffer(c) };
}
async function coffreDechiffrer(cle, iv, donnees) {
  var p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bufferDepuisB64(iv) }, cle, bufferDepuisB64(donnees));
  return JSON.parse(new TextDecoder().decode(p));
}
function genererMdp(n) {
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789-_!?%*+=#', r = crypto.getRandomValues(new Uint32Array(n || 20)), s = '';
  for (var i = 0; i < r.length; i++) s += a[r[i] % a.length];
  return s;
}
function copier(texte, quoi) {
  function secours() { var t = document.createElement('textarea'); t.value = texte; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast(quoi + ' copié.'); } catch (e) { toast('Copie impossible : affichez-le et recopiez-le.', true); } t.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(function () { toast(quoi + ' copié.'); }, secours); else secours();
}

function coffreCreation(c) {
  c.innerHTML = '<div class="carte" style="max-width:640px"><h3>Créer le coffre-fort de la SCI</h3>' +
    '<p>Le coffre-fort conserve les identifiants et mots de passe des comptes de la SCI (banque, impots.gouv, EDF, assurance, comptable, plateforme de factures…). Ils sont chiffrés avec une <b>phrase secrète commune</b> à tous les associés, choisie maintenant.</p>' +

    formulaire([{ k: 'p1', lib: 'Phrase secrète (12 caractères minimum, par exemple 4 ou 5 mots)', type: 'password', large: true }, { k: 'p2', lib: 'Confirmez la phrase secrète', type: 'password', large: true }]) +

var A_TRIER = 'À trier';
function ecranTactile() { try { return window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { return false; } }

// Compression d'une photo (grand côté 2000 px, JPEG 82 %) : envoi rapide même en 4G
function compresserImage(f) {
  if (!/^image\//.test(f.type) || /gif|svg/.test(f.type)) return Promise.resolve(f);
  return new Promise(function (ok) {
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var max = 2000, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function (b) { if (!b || b.size >= f.size) return ok(f); ok(new File([b], (f.name || 'Photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); ok(f); };
    img.src = url;
  });
}
function prendrePhoto() {
  return new Promise(function (ok) {
    var i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment');
    i.onchange = function () { var f = i.files[0]; if (!f) return ok(null); compresserImage(new File([f], 'Photo_' + horodatage() + '.jpg', { type: f.type || 'image/jpeg' })).then(ok); };
    i.click();
  });
}
// Assemble plusieurs photos en un seul PDF (une page par photo)
function photosEnPdf(fichiers, nom) {
  return lib('jspdf').then(function () {
    var pdf = null;
    return fichiers.reduce(function (p, f) {
      return p.then(function () {
        return new Promise(function (ok) {
          var url = URL.createObjectURL(f), img = new Image();
          img.onload = function () {
            var w = img.naturalWidth, h = img.naturalHeight, or = w > h ? 'l' : 'p';
            var largeur = or === 'p' ? 210 : 297, hauteur = or === 'p' ? 297 : 210, k = Math.min(largeur / w, hauteur / h);
            if (!pdf) pdf = new window.jspdf.jsPDF({ orientation: or, unit: 'mm', format: 'a4' }); else pdf.addPage('a4', or);
            pdf.addImage(img, 'JPEG', (largeur - w * k) / 2, (hauteur - h * k) / 2, w * k, h * k);
            URL.revokeObjectURL(url); ok();
          };
          img.src = url;
        });
      });
    }, Promise.resolve()).then(function () { return new File([pdf.output('blob')], nom || ('Document_' + horodatage() + '.pdf'), { type: 'application/pdf' }); });
  });
}

  if (!aTraiter.length) return Promise.resolve({ lettrees: 0, classees: 0, pieces: 0 });

  var res = { lettrees: new Set(props.map(function (l) { return l.transaction_id; })).size, classees: 0, pieces: 0 };
  return (props.length ? appel('inserer', { table: 'lettrages', lignes: props, motif: 'rapprochement automatique' }, { silencieux: true }).then(function (r) { majLocale('lettrages', r); }) : Promise.resolve())
    .then(function () {

      var maj = L('transactions').filter(function (t) { return etatTx(t, lpt2) === 'à traiter'; }).map(function (t) { var k = Compta.suggererCategorie(DB, t); return k && k.indexOf('EMP:') !== 0 ? Object.assign({}, t, { categorie: k }) : null; }).filter(Boolean);
      res.classees = maj.length;

    })

function synchroBanque(manuel) {

    SYNCHRO.enCours = false; DB.banque = r.etat || DB.banque;

  else if (!b.connecte) a.push(['', 'Banque en ligne configurée mais pas encore connectée : <b>Réglages › Banque en ligne › Connecter</b>.', 'parametres', { onglet: 'banque' }]);
  else if (b.erreur) a.push(['rouge', esc(b.erreur), 'parametres', { onglet: 'banque' }]);
  else if (b.joursRestants !== null && b.joursRestants <= 15) a.push([b.joursRestants <= 3 ? 'rouge' : '', 'L’autorisation bancaire expire ' + (b.joursRestants <= 0 ? 'aujourd’hui' : 'dans ' + b.joursRestants + ' jour(s)') + ' : un associé ayant l’accès BNP de la SCI doit la renouveler (<b>Réglages › Banque en ligne › Renouveler</b>).', 'parametres', { onglet: 'banque' }]);
  return a;
}

function paramBanque(c) {
  var b = DB.banque || {};
  var etapes = '<details class="aide"' + (b.configure ? '' : ' open') + '><summary>Mise en place (une seule fois, environ 15 minutes)</summary><ol style="padding-left:18px;margin:8px 0">' +
    '<li>Sur <b>enablebanking.com</b>, connectez-vous avec <b>scipibramedic@gmail.com</b> (lien reçu par e-mail), menu <b>Applications</b> › <b>Register new application</b>.</li>' +
    '<li>Environment : <b>Production</b> ; Name : <b>PibraCompta SCI PIBRAMEDIC</b> ; Redirect URLs : <code style="word-break:break-all">' + esc(MODE_WEB ? urlIci() : (b.urlRetour || DB.url)) + '</code> ; clé : <b>Generate in the browser… and export private key</b>. Conservez le fichier <b>.pem</b> téléchargé et copiez l’<b>identifiant de l’application</b>.</li>' +
    '<li>Cliquez sur <b>Activate by linking accounts</b> : France, BNP Paribas, puis identifiez-vous avec <b>l’accès en ligne de la SCI</b> et sélectionnez le compte de la SCI.</li>' +
    '<li>Ci-dessous : collez l’identifiant, choisissez le fichier .pem, « Enregistrer et tester », puis « Connecter la banque ».</li></ol>' +
    '<p class="doux" style="margin:0">L’autorisation bancaire dure 180 jours ; le logiciel prévient 15 jours avant et tout associé disposant de l’accès BNP de la SCI peut la renouveler d’un clic. Aucun compte personnel ou professionnel d’un associé n’est utilisé.</p></details>';
  var etat = '<div class="carte" style="margin-bottom:14px"><h3>État</h3><dl class="kv">' +
    '<dt>Accès Enable Banking</dt><dd>' + (b.configure ? puce('configuré', 'vert') + ' <span class="doux">' + esc(b.appId) + '</span>' : puce('non configuré', 'gris')) + '</dd>' +
    '<dt>Compte relié</dt><dd>' + (b.connecte ? puce('connecté', 'vert') + ' ' + esc(b.iban) : puce('non connecté', 'gris')) + '</dd>' +
    (b.connecte ? '<dt>Autorisation valable jusqu’au</dt><dd>' + dfr(b.validite) + (b.joursRestants !== null ? ' (' + b.joursRestants + ' jours)' : '') + '</dd><dt>Dernière synchronisation</dt><dd>' + (b.derniere ? dfr(b.derniere) + ' ' + String(new Date(b.derniere).toTimeString()).slice(0, 5) + ' – ' + esc(b.resultat) : 'jamais') + '</dd>' : '') +
    (b.erreur ? '<dt>Erreur</dt><dd class="neg">' + esc(b.erreur) + '</dd>' : '') + '</dl>' +
    '<div class="barre" style="margin:12px 0 0">' + (b.configure ? '<select id="psu" style="width:auto"><option value="business">Accès « Ma Banque Entreprise » de la SCI</option><option value="personal">Accès par numéro client de la SCI</option></select><button class="btn prim" id="cx">' + (b.connecte ? 'Renouveler l’autorisation' : 'Connecter la banque') + '</button>' : '') +
    (b.connecte ? '<button class="btn" id="sy">Synchroniser maintenant</button><button class="btn danger" id="dc">Déconnecter</button>' : '') + '</div></div>';
  var form = '<div class="carte"><h3>' + (b.configure ? 'Changer l’accès Enable Banking' : 'Accès Enable Banking de la SCI') + '</h3>' + formulaire([{ k: 'appId', lib: 'Identifiant de l’application (Application ID)', large: true, defaut: b.appId }]) +
    '<div class="depot" id="pem" style="margin-top:10px;padding:14px">Choisir le fichier de clé privée (.pem)</div><div class="barre" style="margin-top:10px"><button class="btn" id="ok">Enregistrer et tester</button></div>' +
    '<p class="doux" style="font-size:12px;margin-bottom:0">La clé est conservée uniquement dans le projet Google de la SCI (propriétés du script), jamais dans le classeur ni sur les appareils des associés.</p></div>';
  c.innerHTML = '<p class="doux" style="margin-top:0">Les opérations du compte BNP de la SCI sont récupérées automatiquement chaque nuit et à chaque connexion d’un associé (si la dernière date de plus de 3 heures), puis rapprochées et classées comme lors d’un import de relevé.</p>' + etat + etapes + form;
  var pem = null;
  zoneDepot($('#pem', c), '.pem,.key,.txt', false, function (fs) { if (!fs[0]) return; lireFichier(fs[0]).then(function (buf) { pem = new TextDecoder().decode(buf); $('#pem', c).textContent = '🔑 ' + fs[0].name; }); });
  $('#ok', c).onclick = function () {
    var v = lireForm(c); if (!v.appId) return erreur(new Error('Collez l’identifiant de l’application.')); if (!pem) return erreur(new Error('Choisissez le fichier .pem.'));
    appel('banqueConfigurer', { appId: v.appId, pem: pem }, { message: 'Test de l’accès…' }).then(function (r) {
      return appel('banqueEtat', {}, { silencieux: true }).then(function (e) {
        DB.banque = e; rendre();
        modal({ titre: 'Accès Enable Banking', corps: '<div class="alerte vert">Application « ' + esc(r.nom) + ' » reconnue' + (r.actif ? '' : ' (pas encore activée : faites « Activate by linking accounts » chez Enable Banking)') + '.</div>' + (r.urlRetourOk ? '' : '<div class="alerte rouge">L’adresse de retour enregistrée chez Enable Banking doit être exactement :<br><code style="word-break:break-all">' + esc(r.urlRetour) + '</code><br>Corrigez-la dans l’application Enable Banking avant de connecter la banque.</div>') });
      });
    }).catch(erreur);
  };
  if ($('#cx', c)) $('#cx', c).onclick = function () {
    var w = MODE_WEB ? null : window.open('', '_blank');
    appel('banqueConnecter', { psu_type: $('#psu', c).value, retour: MODE_WEB ? urlIci() : undefined }, { message: 'Préparation de la connexion…' }).then(function (r) {
      if (MODE_WEB && r.retour === urlIci()) { location.href = r.url; return; }
      if (!w) w = window.open(r.url, '_blank'); else w.location.href = r.url;
      modal({ titre: 'Connexion à la banque', corps: '<p>La page de la BNP s’est ouverte dans un nouvel onglet. Identifiez-vous avec l’accès en ligne de la SCI et autorisez le compte de la SCI.</p><p>À la fin, une page « Banque connectée » s’affiche : revenez ici et cliquez sur « Actualiser ».</p>' + (w ? '' : '<p><a class="btn prim" href="' + esc(r.url) + '" target="_blank">Ouvrir la page de la banque</a></p>'),
        boutons: [{ lib: 'Actualiser', prim: true, action: function () { return appel('banqueEtat', {}, { silencieux: true }).then(function (e) { DB.banque = e; return appel('charger', {}, { message: 'Chargement…' }); }).then(function (d) { DB.transactions = d.transactions; DB.comptes = d.comptes; DB.banque = d.banque; return traitementAutomatique(); }).then(function () { rendre(); }); } }] });
    }).catch(function (e) { if (w) w.close(); erreur(e); });
  };
  if ($('#sy', c)) $('#sy', c).onclick = function () { synchroBanque(true); };
  if ($('#dc', c)) $('#dc', c).onclick = function () { confirmer('Déconnecter la banque ? La synchronisation automatique s’arrêtera (les opérations déjà récupérées sont conservées).', 'Déconnecter').then(function (o) { if (o) appel('banqueDeconnecter', {}).then(function (e) { DB.banque = e; rendre(); }).catch(erreur); }); };
}

</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
